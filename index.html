// ─── HELPERS ──────────────────────────────────────────────────────────────
const GHC = n=>`GH₵ ${Number(n).toLocaleString("en-GH",{minimumFractionDigits:2})}`;

function Badge({label,color,bg,border}){
  return <span style={{fontSize:11,fontWeight:600,padding:"2px 10px",borderRadius:20,background:bg,color,border:`1px solid ${border}`,letterSpacing:"0.02em",whiteSpace:"nowrap"}}>{label}</span>;
}

const STATUS_MAP = {
  Active:[C.success,C.successBg,"#aedcc2"],
  Maintenance:[C.accent,C.warnBg,C.warnBorder],
  Paid:[C.success,C.successBg,"#aedcc2"],
  Pending:[C.warnText,C.warnBg,C.warnBorder],
  Open:[C.danger,C.dangerBg,"#f5b0b0"],
  "In Review":[C.info,C.infoBg,"#a5c2f2"],
  Resolved:[C.success,C.successBg,"#aedcc2"],
  Expired:[C.danger,C.dangerBg,"#f5b0b0"],
  "Expiring Soon":[C.warnText,C.warnBg,C.warnBorder],
  Unknown:[C.muted,"#f0f2f5","#c8cdd4"],
};

function StatusBadge({s}){
  const [color,bg,border]=STATUS_MAP[s]||STATUS_MAP.Unknown;
  return <Badge label={s} color={color} bg={bg} border={border}/>;
}

function Card({children,style}){
  return <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.border}`,padding:"20px 22px",...style}}>{children}</div>;
}

function SectionTitle({title,action}){
  return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}>
    <h2 style={{fontSize:17,fontWeight:700,color:C.primary,margin:0}}>{title}</h2>
    {action}
  </div>;
}

function Tbl({headers,rows}){
  return <div style={{overflowX:"auto"}}>
    <table style={{fontSize:13}}>
      <thead><tr>{headers.map((h,i)=><th key={i} style={{padding:"8px 12px",background:"#f4f6f9",color:C.muted,fontWeight:600,textAlign:"left",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>
      <tbody>{rows.map((row,i)=><tr key={i} style={{borderBottom:`1px solid ${C.border}`}}>{row.map((cell,j)=><td key={j} style={{padding:"9px 12px",verticalAlign:"middle"}}>{cell}</td>)}</tr>)}</tbody>
    </table>
  </div>;
}

function MetricCard({label,value,sub,color}){
  return <div style={{background:color||"#f4f6f9",borderRadius:10,padding:"16px 20px",border:`1px solid ${C.border}`}}>
    <div style={{fontSize:12,color:C.muted,fontWeight:600,marginBottom:6}}>{label}</div>
    <div style={{fontSize:22,fontWeight:700,color:C.primary}}>{value}</div>
    {sub&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>{sub}</div>}
  </div>;
}

function Btn({children,onClick,variant="primary",small}){
  const s={primary:{background:C.primary,color:"#fff",border:"none"},accent:{background:C.accent,color:"#fff",border:"none"},outline:{background:"#fff",color:C.primary,border:`1px solid ${C.primary}`}};
  return <button onClick={onClick} style={{...s[variant],cursor:"pointer",borderRadius:7,padding:small?"5px 12px":"8px 16px",fontSize:small?12:13,fontWeight:600}}>{children}</button>;
}

function Inp({label,value,onChange,type="text",options,required}){
  return <div style={{display:"flex",flexDirection:"column",gap:4}}>
    <label style={{fontSize:12,fontWeight:600,color:C.muted}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>
    {options
      ? <select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text,background:"#fff"}}>
          <option value="">Select…</option>
          {options.map(o=><option key={o} value={o}>{o}</option>)}
        </select>
      : <input type={type} value={value} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text}}/>}
  </div>;
}

function getInsStatus(expiry){
  if(!expiry) return "Unknown";
  const diff=Math.ceil((new Date(expiry)-new Date("2026-06-05"))/(86400000));
  return diff<0?"Expired":diff<=30?"Expiring Soon":"Active";
}

// ─── CHART PAGE ────────────────────────────────────────────────────────────

function FinancialChart({sales,expenses,oil,salaries,parts,payments}){
  const barRef=useRef(null), pieRef=useRef(null), lineRef=useRef(null);
  const barChart=useRef(null), pieChart=useRef(null), lineChart=useRef(null);

  const allWeeks=[...new Set([
    ...sales.map(s=>s.week),...oil.map(o=>o.week),
    ...salaries.map(s=>s.week),...parts.map(p=>p.week),
    ...payments.map(p=>p.week),...expenses.map(e=>e.week)
  ])].slice(0,5).reverse();

  const weekData=allWeeks.map(wk=>({
    week:wk,
    revenue:sales.filter(s=>s.week===wk).reduce((a,b)=>a+b.revenue,0),
    oil:oil.filter(o=>o.week===wk).reduce((a,b)=>a+b.total,0),
    salaries:salaries.filter(s=>s.week===wk).reduce((a,b)=>a+b.total,0),
    parts:parts.filter(p=>p.week===wk).reduce((a,b)=>a+b.total,0),
    expenses:expenses.filter(e=>e.week===wk).reduce((a,b)=>a+b.amount,0),
    payments:payments.filter(p=>p.week===wk).reduce((a,b)=>a+b.amount,0),
  }));

  const weekLabels=allWeeks.map(w=>w.replace(/\(.*\)/,"").trim());

  useEffect(()=>{
    // Bar chart: Revenue vs Total Expenses
    if(barChart.current) barChart.current.destroy();
    barChart.current=new Chart(barRef.current,{
      type:"bar",
      data:{
        labels:weekLabels,
        datasets:[
          {label:"Revenue (Money In)",data:weekData.map(d=>d.revenue),backgroundColor:"rgba(26,122,74,0.8)",borderColor:"#1a7a4a",borderWidth:1,borderRadius:4},
          {label:"Total Expenses (Money Out)",data:weekData.map(d=>d.oil+d.salaries+d.parts+d.expenses+d.payments),backgroundColor:"rgba(185,48,48,0.75)",borderColor:"#b93030",borderWidth:1,borderRadius:4},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top",labels:{font:{size:12}}}},scales:{y:{beginAtZero:true,ticks:{callback:v=>"GH₵"+v.toLocaleString()},grid:{color:"rgba(0,0,0,0.05)"}},x:{grid:{display:false}}}}
    });

    // Pie chart: expense breakdown (latest week)
    const latest=weekData[weekData.length-1]||{oil:0,salaries:0,parts:0,expenses:0,payments:0};
    if(pieChart.current) pieChart.current.destroy();
    pieChart.current=new Chart(pieRef.current,{
      type:"doughnut",
      data:{
        labels:["Oil","Driver Salaries","Car Parts","Other Expenses","Payments to Others"],
        datasets:[{data:[latest.oil,latest.salaries,latest.parts,latest.expenses,latest.payments],backgroundColor:["#e8a020","#1a3a5c","#e05050","#1a5cbf","#1a7a4a"],borderWidth:2,borderColor:"#fff"}]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{font:{size:11},padding:12}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: GH₵${ctx.parsed.toLocaleString()}`}}}}
    });

    // Line chart: Net Profit trend
    if(lineChart.current) lineChart.current.destroy();
    lineChart.current=new Chart(lineRef.current,{
      type:"line",
      data:{
        labels:weekLabels,
        datasets:[
          {label:"Net Profit",data:weekData.map(d=>d.revenue-(d.oil+d.salaries+d.parts+d.expenses+d.payments)),borderColor:"#1a3a5c",backgroundColor:"rgba(26,58,92,0.08)",fill:true,tension:0.3,pointBackgroundColor:"#1a3a5c",pointRadius:5},
          {label:"Revenue",data:weekData.map(d=>d.revenue),borderColor:"#1a7a4a",backgroundColor:"transparent",tension:0.3,pointBackgroundColor:"#1a7a4a",pointRadius:4,borderDash:[5,3]},
        ]
      },
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top",labels:{font:{size:12}}}},scales:{y:{ticks:{callback:v=>"GH₵"+v.toLocaleString()},grid:{color:"rgba(0,0,0,0.05)"}},x:{grid:{display:false}}}}
    });
    return ()=>{barChart.current?.destroy();pieChart.current?.destroy();lineChart.current?.destroy()};
  },[]);

  const latestWeek=weekData[weekData.length-1]||{};
  const totalOut=(latestWeek.oil||0)+(latestWeek.salaries||0)+(latestWeek.parts||0)+(latestWeek.expenses||0)+(latestWeek.payments||0);
  const netProfit=(latestWeek.revenue||0)-totalOut;
  const lastWeek=weekData[weekData.length-2];
  const prevNet=lastWeek?(lastWeek.revenue-(lastWeek.oil+lastWeek.salaries+lastWeek.parts+lastWeek.expenses+lastWeek.payments)):0;

  return <div style={{padding:24,display:"flex",flexDirection:"column",gap:20}}>
    <div>
      <h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>Financial Overview</h1>
      <p style={{margin:"4px 0 0",fontSize:13,color:C.muted}}>Money In vs Money Out — all weeks</p>
    </div>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:14}}>
      <MetricCard label="Latest Week Revenue" value={GHC(latestWeek.revenue||0)} sub="Money In" color="#e9f5ee"/>
      <MetricCard label="Latest Week Expenses" value={GHC(totalOut)} sub="Money Out" color="#fceaea"/>
      <MetricCard label="Net Profit" value={GHC(netProfit)} sub={netProfit>=0?"Positive":"Loss"} color={netProfit>=0?"#e9f5ee":"#fceaea"}/>
      <MetricCard label="vs Previous Week" value={(netProfit-prevNet>=0?"+":"")+GHC(netProfit-prevNet)} sub="Net change" color={netProfit-prevNet>=0?"#e9f5ee":"#fceaea"}/>
    </div>

    <Card>
      <h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Revenue vs Total Expenses by Week</h3>
      <div style={{height:280}}><canvas ref={barRef}/></div>
    </Card>

    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card>
        <h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Expense Breakdown — Latest Week</h3>
        <div style={{height:240}}><canvas ref={pieRef}/></div>
      </Card>
      <Card>
        <h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Net Profit Trend</h3>
        <div style={{height:240}}><canvas ref={lineRef}/></div>
      </Card>
    </div>

    <Card>
      <h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Weekly Summary Table</h3>
      <Tbl
        headers={["Week","Revenue","Oil","Salaries","Parts","Expenses","Payments","Total Out","Net"]}
        rows={weekData.map(d=>{
          const out=d.oil+d.salaries+d.parts+d.expenses+d.payments;
          const net=d.revenue-out;
          return[
            d.week,
            <span style={{color:C.success,fontWeight:600}}>{GHC(d.revenue)}</span>,
            GHC(d.oil),GHC(d.salaries),GHC(d.parts),GHC(d.expenses),GHC(d.payments),
            <span style={{color:C.danger,fontWeight:600}}>{GHC(out)}</span>,
            <span style={{color:net>=0?C.success:C.danger,fontWeight:700}}>{GHC(net)}</span>
          ];
        })}
      />
    </Card>
  </div>;
}

function PaymentsPage({payments,setPayments}){
  const [form,setForm]=useState({week:WEEKS[0],payee:"",purpose:"",amount:"",method:"Cash",status:"Pending"});
  const [adding,setAdding]=useState(false);
  const fld=k=>v=>setForm(f=>({...f,[k]:v}));
  const add=()=>{
    if(!form.payee||!form.amount) return alert("Fill required fields");
    setPayments(p=>[...p,{...form,id:Date.now(),amount:Number(form.amount)}]);
    setForm({week:WEEKS[0],payee:"",purpose:"",amount:"",method:"Cash",status:"Pending"});
    setAdding(false);
  };
  const toggleStatus=id=>setPayments(p=>p.map(x=>x.id===id?{...x,status:x.status==="Paid"?"Pending":"Paid"}:x));
  const weeks=[...new Set(payments.map(p=>p.week))];
  const grand=payments.reduce((a,b)=>a+b.amount,0);

  return <div style={{padding:24}}>
    <SectionTitle title="Weekly Payments to Others" action={<Btn onClick={()=>setAdding(a=>!a)}>{adding?"Cancel":"+ Add Payment"}</Btn>}/>
    <div style={{background:"#f0f4fa",border:`1px solid ${C.border}`,borderRadius:8,padding:"10px 16px",marginBottom:20,fontSize:13,color:C.muted}}>
      Record weekly payments made to external parties — guards, cleaners, mechanics, IT staff, or any service provider outside the driver payroll.
    </div>

function Dashboard({cars,sales,expenses,oil,salaries,parts,logs,payments}){
  const wk=WEEKS[0];
  const rev=sales.filter(s=>s.week===wk).reduce((a,b)=>a+b.revenue,0);
  const totalOil=oil.filter(o=>o.week===wk).reduce((a,b)=>a+b.total,0);
  const totalExp=expenses.filter(e=>e.week===wk).reduce((a,b)=>a+b.amount,0);
  const totalSal=salaries.filter(s=>s.week===wk).reduce((a,b)=>a+b.total,0);
  const totalParts=parts.filter(p=>p.week===wk).reduce((a,b)=>a+b.total,0);
  const totalPay=payments.filter(p=>p.week===wk).reduce((a,b)=>a+b.amount,0);
  const out=totalOil+totalExp+totalSal+totalParts+totalPay;
  const net=rev-out;
  const weekSales=sales.filter(s=>s.week===wk);
  const openIssues=logs.filter(l=>l.status!=="Resolved").length;
  return <div style={{padding:24,display:"flex",flexDirection:"column",gap:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>Dashboard Overview</h1>
        <p style={{margin:"4px 0 0",fontSize:13,color:C.muted}}>Current: {wk}</p></div>
      <div style={{fontSize:12,color:C.muted}}>5 Jun 2026</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14}}>
      <MetricCard label="Weekly Revenue" value={GHC(rev)} sub={`${weekSales.length} drivers`}/>
      <MetricCard label="Net Profit" value={GHC(net)} sub="After all expenses" color={net>=0?"#e9f5ee":"#fceaea"}/>
      <MetricCard label="Fleet Size" value={cars.length} sub={`${cars.filter(c=>c.status==="Active").length} active`}/>
      <MetricCard label="Open Issues" value={openIssues} sub="Accidents & claims" color={openIssues>0?C.warnBg:"#f4f6f9"}/>
      <MetricCard label="Salary Paid" value={GHC(salaries.filter(s=>s.week===wk&&s.status==="Paid").reduce((a,b)=>a+b.total,0))} sub="This week"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card>
        <SectionTitle title="Top Earners — This Week"/>
        <Tbl headers={["Driver","Trips","Revenue"]} rows={[...weekSales].sort((a,b)=>b.revenue-a.revenue).map(s=>[s.driver,s.trips,<span style={{color:C.success,fontWeight:600}}>{GHC(s.revenue)}</span>])}/>
      </Card>
      <Card>
        <SectionTitle title="Expense Breakdown"/>
        {[["Oil",totalOil],["Salaries",totalSal],["Parts",totalParts],["Payments to Others",totalPay],["Other Expenses",totalExp]].map(([l,v])=>
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
            <span style={{color:C.muted}}>{l}</span><span style={{fontWeight:600}}>{GHC(v)}</span>
          </div>)}
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0 0",fontSize:14,fontWeight:700}}>
          <span>Total Out</span><span style={{color:C.danger}}>{GHC(out)}</span>
        </div>
      </Card>
    </div>
    <Card>
      <SectionTitle title="Recent Issues"/>
      <Tbl headers={["Date","Car","Driver","Type","Status"]} rows={logs.slice(0,3).map(l=>[l.date,l.carID,l.driver,l.type,<StatusBadge s={l.status}/>])}/>
    </Card>
  </div>;
}

    setForm({carID:CARS_LIST[0],insurer:"",policyNo:"",issueDate:"",expiryDate:"",premium:"",type:"Comprehensive"});setAdding(false);
  };
  const records=insurance.map(r=>({...r,status:getInsStatus(r.expiryDate)}));
  const expired=records.filter(r=>r.status==="Expired").length;
  const soon=records.filter(r=>r.status==="Expiring Soon").length;
  return <div style={{padding:24}}>
    <SectionTitle title="Vehicle Insurance Registry" action={<Btn onClick={()=>setAdding(a=>!a)}>{adding?"Cancel":"+ Add Insurance"}</Btn>}/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:14,marginBottom:20}}>
      <MetricCard label="Total Vehicles" value={records.length} sub="Registered"/>
      <MetricCard label="Active" value={records.filter(r=>r.status==="Active").length} sub="Valid policies" color={C.successBg}/>
      <MetricCard label="Expiring Soon" value={soon} sub="Within 30 days" color={soon>0?C.warnBg:"#f4f6f9"}/>
      <MetricCard label="Expired" value={expired} sub="Needs renewal" color={expired>0?C.dangerBg:"#f4f6f9"}/>
    </div>
    {adding&&<Card style={{marginBottom:20,background:"#f8fafd"}}>
      <p style={{margin:"0 0 14px",fontWeight:600,fontSize:14}}>New Insurance Record</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(150px,1fr))",gap:12,marginBottom:14}}>
        <Inp label="Car ID" value={form.carID} onChange={fld("carID")} options={CARS_LIST} required/>
        <Inp label="Insurer" value={form.insurer} onChange={fld("insurer")} required/>
        <Inp label="Policy Number" value={form.policyNo} onChange={fld("policyNo")}/>
        <Inp label="Cover Type" value={form.type} onChange={fld("type")} options={["Comprehensive","Third Party","Third Party Fire & Theft"]}/>
        <Inp label="Issue Date" value={form.issueDate} onChange={fld("issueDate")} type="date"/>
        <Inp label="Expiry Date" value={form.expiryDate} onChange={fld("expiryDate")} type="date" required/>
        <Inp label="Premium (GH₵)" value={form.premium} onChange={fld("premium")} type="number"/>
      </div>
      <Btn onClick={add} variant="accent">Save Insurance</Btn>
    </Card>}
    {(expired>0||soon>0)&&<div style={{background:C.warnBg,border:`1px solid ${C.warnBorder}`,borderRadius:8,padding:"10px 16px",marginBottom:18,fontSize:13,color:C.warnText}}>
      ⚠️ <strong>{expired} vehicle{expired!==1?"s":""}</strong>{expired>0?" ha"+(expired===1?"s":"ve")+" expired insurance":""}
      {expired>0&&soon>0?" and ":""}{soon>0?`${soon} vehicle${soon!==1?"s are":" is"} expiring within 30 days`:""}.  Please arrange renewal.
    </div>}
    <Card>
      <Tbl headers={["Car ID","Plate","Insurer","Policy No.","Type","Issue Date","Expiry Date","Premium","Status"]}
        rows={records.map(r=>[
          <span style={{fontWeight:600,color:C.primary}}>{r.carID}</span>,r.plate,r.insurer,
          <span style={{fontFamily:"monospace",fontSize:11}}>{r.policyNo||"—"}</span>,
          <span style={{fontSize:12}}>{r.type}</span>,r.issueDate||"—",
          <span style={{fontWeight:600,color:r.status==="Expired"?C.danger:r.status==="Expiring Soon"?C.warnText:C.text}}>{r.expiryDate}</span>,
          <span style={{color:C.info,fontWeight:600}}>{GHC(r.premium)}</span>,
          <StatusBadge s={r.status}/>])}/>
    </Card>
  </div>;
}

function LogPage({logs,setLogs}){
  const [form,setForm]=useState({date:"",carID:CARS_LIST[0],driver:"",type:"Accident",severity:"Low",desc:"",status:"Open"});
  const [adding,setAdding]=useState(false);
  const [detail,setDetail]=useState(null);
  const fld=k=>v=>setForm(f=>({...f,[k]:v}));
  const add=()=>{
    if(!form.date||!form.desc) return alert("Fill required fields");
    setLogs(l=>[...l,{...form,id:Date.now()}]);
    setForm({date:"",carID:CARS_LIST[0],driver:"",type:"Accident",severity:"Low",desc:"",status:"Open"});setAdding(false);
  };
  const sevColor={Low:[C.success,"#e6f4ec"],Moderate:[C.accent,C.warnBg],High:[C.danger,C.dangerBg]};
  return <div style={{padding:24}}>
    <SectionTitle title="Issue Log — Accidents, Claims & Incidents" action={<Btn onClick={()=>setAdding(a=>!a)}>{adding?"Cancel":"+ Report Issue"}</Btn>}/>
    {adding&&<Card style={{marginBottom:20,background:"#f8fafd"}}>
      <p style={{margin:"0 0 14px",fontWeight:600,fontSize:14}}>New Incident Report</p>
      <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(160px,1fr))",gap:12,marginBottom:14}}>
        <Inp label="Date" value={form.date} onChange={fld("date")} type="date" required/>
        <Inp label="Car ID" value={form.carID} onChange={fld("carID")} options={CARS_LIST}/>
        <Inp label="Driver" value={form.driver} onChange={fld("driver")}/>
        <Inp label="Type" value={form.type} onChange={fld("type")} options={["Accident","Insurance Claim","Breakdown","Traffic Offence","Vehicle Theft","Other"]}/>
        <Inp label="Severity" value={form.severity} onChange={fld("severity")} options={["Low","Moderate","High"]}/>
        <Inp label="Status" value={form.status} onChange={fld("status")} options={["Open","In Review","Resolved"]}/>
      </div>
      <div style={{marginBottom:14}}>
        <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Description <span style={{color:C.danger}}>*</span></label>
        <textarea value={form.desc} onChange={e=>fld("desc")(e.target.value)} rows={3} style={{display:"block",width:"100%",marginTop:4,padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text,resize:"vertical",boxSizing:"border-box"}}/>
      </div>
      <Btn onClick={add} variant="accent">Submit Report</Btn>
    </Card>}
    {detail&&<Card style={{marginBottom:20,background:"#fdf9f3",border:`1.5px solid ${C.accent}`}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:10}}>
        <span style={{fontWeight:700,fontSize:15,color:C.primary}}>{detail.type} — {detail.carID}</span>
        <Btn small variant="outline" onClick={()=>setDetail(null)}>Close</Btn>
      </div>
      <div style={{display:"grid",gridTemplateColumns:"repeat(3,1fr)",gap:10,marginBottom:12,fontSize:13}}>
        <div><span style={{color:C.muted}}>Date: </span><strong>{detail.date}</strong></div>
        <div><span style={{color:C.muted}}>Driver: </span><strong>{detail.driver}</strong></div>
        <div><span style={{color:C.muted}}>Status: </span><StatusBadge s={detail.status}/></div>
      </div>
      <div style={{fontSize:13,background:"#fff",padding:"10px 14px",borderRadius:8,border:`1px solid ${C.border}`}}>{detail.desc}</div>
    </Card>}
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {logs.map(l=>{
        const [sc,sbg]=sevColor[l.severity]||[C.muted,"#f0f2f5"];
        return <Card key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
              <span style={{fontWeight:700,color:C.primary,fontSize:14}}>{l.type}</span>
              <Badge label={l.severity} color={sc} bg={sbg} border={sc+"66"}/>
              <StatusBadge s={l.status}/>
              <span style={{fontSize:12,color:C.muted}}>• {l.date}</span>
            </div>
            <div style={{fontSize:13,color:C.muted,marginBottom:4}}><strong style={{color:C.text}}>{l.carID}</strong> — Driver: {l.driver||"N/A"}</div>
            <div style={{fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:480}}>{l.desc}</div>
          </div>
          <Btn small variant="outline" onClick={()=>setDetail(detail?.id===l.id?null:l)}>View</Btn>
        </Card>;
      })}
    </div>
  </div>;
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────
function App(){
  const [page,setPage]=useState("dashboard");
  const [cars,setCars]=useState(initCars);
  const [sales,setSales]=useState(initSales);
  const [expenses,setExpenses]=useState(initExpenses);
  const [payments,setPayments]=useState(initPayments);
  const [oil,setOil]=useState(initOil);
  const [salaries,setSalaries]=useState(initSalaries);
  const [parts,setParts]=useState(initParts);
  const [insurance,setInsurance]=useState(initInsurance);
  const [logs,setLogs]=useState(initLogs);
  const [sideOpen,setSideOpen]=useState(true);

  const nav=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {id:"finance",icon:"📈",label:"Financial Charts"},
    {id:"cars",icon:"🚐",label:"Fleet & Drivers"},
    {id:"sales",icon:"💰",label:"Weekly Sales"},
    {id:"payments",icon:"👥",label:"Payments to Others"},
    {id:"expenses",icon:"📋",label:"Other Expenses"},
    {id:"oil",icon:"🛢️",label:"Oil Records"},
    {id:"salaries",icon:"👷",label:"Driver Salaries"},
    {id:"parts",icon:"🔧",label:"Car Parts"},
    {id:"insurance",icon:"🛡️",label:"Insurance"},
    {id:"log",icon:"📝",label:"Issue Log"},
  ];

  const pages={
    dashboard:<Dashboard cars={cars} sales={sales} expenses={expenses} oil={oil} salaries={salaries} parts={parts} logs={logs} payments={payments}/>,
    finance:<FinancialChart sales={sales} expenses={expenses} oil={oil} salaries={salaries} parts={parts} payments={payments}/>,
    cars:<CarsPage cars={cars} setCars={setCars}/>,
    sales:<SalesPage sales={sales} setSales={setSales}/>,
    payments:<PaymentsPage payments={payments} setPayments={setPayments}/>,
    expenses:<ExpensesPage expenses={expenses} setExpenses={setExpenses}/>,
    oil:<OilPage oil={oil} setOil={setOil}/>,
    salaries:<SalariesPage salaries={salaries} setSalaries={setSalaries}/>,
    parts:<PartsPage parts={parts} setParts={setParts}/>,
    insurance:<InsurancePage insurance={insurance} setInsurance={setInsurance} cars={cars}/>,
    log:<LogPage logs={logs} setLogs={setLogs}/>,
  };

  return <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",background:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    {/* Header */}
    <div style={{background:C.primary,color:"#fff",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,boxShadow:"0 2px 8px rgba(0,0,0,0.2)",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>setSideOpen(o=>!o)} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer",padding:4,lineHeight:1}}>☰</button>
        <div style={{width:38,height:38,borderRadius:9,background:C.accent,display:"flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:14,color:"#fff"}}>BYT</div>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>BYT Transport</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.6)"}}>Transport Management System</div>
        </div>
      </div>
      <div style={{fontSize:11,color:"rgba(255,255,255,0.65)",textAlign:"right"}}>
        <div>📍 Kasoa, Ghana</div>
        <div>📞 0557086481</div>
      </div>
    </div>

    <div style={{display:"flex",flex:1,overflow:"hidden",height:"calc(100vh - 60px)"}}>
      {/* Sidebar */}
      {sideOpen&&<div style={{width:200,background:"#fff",borderRight:`1px solid ${C.border}`,padding:"12px 0",display:"flex",flexDirection:"column",gap:1,flexShrink:0,overflowY:"auto"}}>
        {nav.map(i=><button key={i.id} onClick={()=>setPage(i.id)} style={{
          display:"flex",alignItems:"center",gap:9,padding:"9px 18px",
          background:page===i.id?"#eef2f8":"transparent",border:"none",cursor:"pointer",
          textAlign:"left",color:page===i.id?C.primary:C.text,
          fontWeight:page===i.id?600:400,fontSize:13,
          borderLeft:page===i.id?`3px solid ${C.primary}`:"3px solid transparent"}}>
          <span style={{fontSize:15}}>{i.icon}</span>{i.label}
        </button>)}
      </div>}

      {/* Content */}
      <div style={{flex:1,overflowY:"auto"}}>{pages[page]}</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
