<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>BYT Transport — Management System</title>
<link rel="manifest" href="manifest.json"/>
<meta name="theme-color" content="#1a3a5c"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="BYT Transport"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:#f4f6f9;color:#1a2535}
::-webkit-scrollbar{width:6px;height:6px}
::-webkit-scrollbar-track{background:#f1f1f1}
::-webkit-scrollbar-thumb{background:#c5cdd8;border-radius:3px}
input,select,textarea,button{font-family:inherit}
table{border-collapse:collapse;width:100%}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);display:flex;align-items:center;justify-content:center;z-index:999;padding:16px}
.modal{background:#fff;border-radius:14px;padding:28px;width:100%;max-width:540px;box-shadow:0 12px 48px rgba(0,0,0,0.22);max-height:90vh;overflow-y:auto}
.fade{animation:fadeIn 0.2s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const {useState,useEffect,useRef,useCallback,useMemo}=React;

/* ─────────────────────────────────────────
   THEME
───────────────────────────────────────── */
const ROLES={GM:"gm",OPS:"ops",DRIVER:"driver"};
const ROLE_LABELS={gm:"General Manager",ops:"Operational Manager",driver:"Driver"};
const ROLE_COLORS={gm:"#1a3a5c",ops:"#1a5cbf",driver:"#1a7a4a"};
const ROLE_BG={gm:"#e8eef6",ops:"#e8eefb",driver:"#e6f4ec"};

const C={primary:"#1a3a5c",accent:"#e8a020",bg:"#f4f6f9",
  border:"#dde3ec",text:"#1a2535",muted:"#6b7a8d",
  success:"#1a7a4a",danger:"#b93030",info:"#1a5cbf",
  sBg:"#e6f4ec",dBg:"#fceaea",iBg:"#e8eefb",
  wBg:"#fdf3e0",wTx:"#b96a10",wBd:"#f5d38a"};

/* ─────────────────────────────────────────
   LOCAL STORAGE
───────────────────────────────────────── */
const LS={
  get:k=>{try{const v=localStorage.getItem("byt2_"+k);return v?JSON.parse(v):null}catch{return null}},
  set:(k,v)=>{try{localStorage.setItem("byt2_"+k,JSON.stringify(v))}catch{}}
};
const uid=()=>Math.random().toString(36).slice(2)+Date.now().toString(36);
const GHC=n=>`GH₵ ${Number(n||0).toLocaleString("en-GH",{minimumFractionDigits:2})}`;
const today=()=>new Date().toISOString().slice(0,10);
const daysUntil=d=>{if(!d)return null;return Math.ceil((new Date(d)-new Date())/(864e5));};
const expiryStatus=d=>{const n=daysUntil(d);if(n===null)return"Unknown";if(n<0)return"Expired";if(n<=30)return"Expiring Soon";return"Active";};
const WEEKS=Array.from({length:20},(_,i)=>{const d=new Date();d.setDate(d.getDate()-i*7);const wn=Math.ceil((d-new Date(d.getFullYear(),0,1))/(864e5*7));return`Week ${wn} ${d.getFullYear()}`;});

const DEFAULT_BRAND={
  companyName:"BYT Transport",
  logoText:"BYT",
  tagline:"Management System",
  address:"Kasoa, Ghana",
  phone:"0557086481",
  email:"",
  primaryColor:"#1a3a5c",
  accentColor:"#e8a020",
  logoImage:"",
  loginBg:"",
  appBg:"",
};
const loadBrand=()=>({...DEFAULT_BRAND,...(LS.get("brand")||{})});
const saveBrand=b=>LS.set("brand",b);

/* ─────────────────────────────────────────
   INITIAL DATA BOOTSTRAP
───────────────────────────────────────── */
function bootstrap(){
  if(LS.get("bootstrapped"))return;
  // Seed users
  const users=[
    {id:"gm1",role:ROLES.GM,username:"gm",password:"gm2024",name:"General Manager",email:"gm@byttransport.gh",status:"active",createdAt:today()},
    {id:"ops1",role:ROLES.OPS,username:"ops",password:"ops2024",name:"Ops Manager",email:"ops@byttransport.gh",status:"active",createdAt:today()},
    {id:"drv1",role:ROLES.DRIVER,username:"kwame",password:"drv2024",name:"Kwame Asante",driverID:"DRV-101",email:"",status:"active",createdAt:today()},
    {id:"drv2",role:ROLES.DRIVER,username:"kofi",password:"drv2024",name:"Kofi Mensah",driverID:"DRV-102",email:"",status:"active",createdAt:today()},
    {id:"drv3",role:ROLES.DRIVER,username:"yaw",password:"drv2024",name:"Yaw Boateng",driverID:"DRV-103",email:"",status:"active",createdAt:today()},
  ];
  LS.set("users",users);

  // Seed car info per driver
  const carInfo=[
    {id:uid(),driverID:"drv1",carNumber:"BYT-001",plate:"GR-8821-23",make:"Toyota Sprinter",color:"White",licenseNo:"GH-1234567",licenseExpiry:"2027-05-01",roadworthyIssued:"2026-01-10",roadworthyExpiry:"2027-01-09",updatedAt:today()},
    {id:uid(),driverID:"drv2",carNumber:"BYT-002",plate:"GR-4432-22",make:"Hyundai H100",color:"Silver",licenseNo:"GH-2345678",licenseExpiry:"2026-11-15",roadworthyIssued:"2026-02-01",roadworthyExpiry:"2027-01-31",updatedAt:today()},
    {id:uid(),driverID:"drv3",carNumber:"BYT-003",plate:"GR-7754-21",make:"Mercedes Sprinter",color:"Blue",licenseNo:"GH-3456789",licenseExpiry:"2028-03-20",roadworthyIssued:"2026-03-05",roadworthyExpiry:"2027-03-04",updatedAt:today()},
  ];
  LS.set("carInfo",carInfo);

  // Seed driver sales
  const driverSales=[
    {id:uid(),driverID:"drv1",week:WEEKS[0],trips:28,amount:2800,notes:"",submittedAt:today()},
    {id:uid(),driverID:"drv2",week:WEEKS[0],trips:24,amount:2400,notes:"",submittedAt:today()},
    {id:uid(),driverID:"drv3",week:WEEKS[0],trips:30,amount:3000,notes:"",submittedAt:today()},
    {id:uid(),driverID:"drv1",week:WEEKS[1],trips:25,amount:2500,notes:"",submittedAt:today()},
    {id:uid(),driverID:"drv2",week:WEEKS[1],trips:27,amount:2700,notes:"",submittedAt:today()},
  ];
  LS.set("driverSales",driverSales);

  // Seed ops data
  const opsSales=[
    {id:uid(),week:WEEKS[0],totalRevenue:10400,fuelCost:1560,netRevenue:8840,notes:"",submittedBy:"ops1",submittedAt:today()},
  ];
  LS.set("opsSales",opsSales);

  const parts=[
    {id:uid(),week:WEEKS[0],carNumber:"BYT-001",part:"Brake Pads",supplier:"Auto Parts GH",qty:2,unitCost:180,total:360,submittedBy:"ops1",submittedAt:today()},
    {id:uid(),week:WEEKS[0],carNumber:"BYT-003",part:"Air Filter",supplier:"Kasoa Motors",qty:1,unitCost:75,total:75,submittedBy:"ops1",submittedAt:today()},
  ];
  LS.set("parts",parts);

  const oil=[
    {id:uid(),week:WEEKS[0],oilType:"5W-30 Synthetic",litres:20,costPerL:45,total:900,supplier:"Kasoa Oil Depot",notes:"",submittedBy:"ops1",submittedAt:today()},
  ];
  LS.set("oil",oil);

  const insurance=[
    {id:uid(),carNumber:"BYT-001",insurer:"Star Assurance",policyNo:"SA-2024-00183",issueDate:"2025-06-01",expiryDate:"2026-05-31",premium:1800,type:"Comprehensive",submittedBy:"ops1",submittedAt:today()},
    {id:uid(),carNumber:"BYT-002",insurer:"Enterprise Insurance",policyNo:"EI-2025-00741",issueDate:"2025-09-15",expiryDate:"2026-09-14",premium:1600,type:"Comprehensive",submittedBy:"ops1",submittedAt:today()},
    {id:uid(),carNumber:"BYT-003",insurer:"Star Assurance",policyNo:"SA-2025-00452",issueDate:"2026-01-10",expiryDate:"2027-01-09",premium:2100,type:"Comprehensive",submittedBy:"ops1",submittedAt:today()},
  ];
  LS.set("insurance",insurance);

  const logs=[
    {id:uid(),date:"2026-06-03",carNumber:"BYT-001",driverName:"Kwame Asante",type:"Accident",severity:"Moderate",desc:"Minor collision at Kasoa roundabout.",status:"Open",submittedBy:"ops1",submittedAt:today()},
  ];
  LS.set("logs",logs);

  const payments=[
    {id:uid(),week:WEEKS[0],payee:"Kasoa Security Co.",purpose:"Night guard",amount:400,method:"Mobile Money",status:"Paid",submittedBy:"ops1",submittedAt:today()},
  ];
  LS.set("payments",payments);

  LS.set("bootstrapped",true);
}
bootstrap();

/* ─────────────────────────────────────────
   SHARED UI COMPONENTS
───────────────────────────────────────── */
const SM={Active:[C.success,C.sBg,"#aedcc2"],Maintenance:[C.accent,C.wBg,C.wBd],Paid:[C.success,C.sBg,"#aedcc2"],Pending:[C.wTx,C.wBg,C.wBd],Open:[C.danger,C.dBg,"#f5b0b0"],"In Review":[C.info,C.iBg,"#a5c2f2"],Resolved:[C.success,C.sBg,"#aedcc2"],Expired:[C.danger,C.dBg,"#f5b0b0"],"Expiring Soon":[C.wTx,C.wBg,C.wBd],Unknown:[C.muted,"#f0f2f5","#c8cdd4"]};
function Bdg({label,color,bg,border}){return <span style={{fontSize:11,fontWeight:600,padding:"2px 10px",borderRadius:20,background:bg,color,border:`1px solid ${border}`,whiteSpace:"nowrap"}}>{label}</span>;}
function SBdg({s}){const[c,bg,b]=SM[s]||SM.Unknown;return <Bdg label={s} color={c} bg={bg} border={b}/>;}
function RoleBdg({role}){return <Bdg label={ROLE_LABELS[role]||role} color={ROLE_COLORS[role]||C.muted} bg={ROLE_BG[role]||"#f0f2f5"} border={ROLE_COLORS[role]+"44"}/>;}

function Card({children,style}){return <div style={{background:"rgba(255,255,255,0.97)",borderRadius:12,border:`1px solid ${C.border}`,padding:"20px 22px",boxShadow:"0 1px 4px rgba(0,0,0,0.05)",...style}}>{children}</div>;}
function PageTitle({title,sub,action}){return <div style={{display:"flex",alignItems:"flex-start",justifyContent:"space-between",marginBottom:22,gap:12}}><div><h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>{title}</h1>{sub&&<p style={{margin:"4px 0 0",fontSize:13,color:C.muted}}>{sub}</p>}</div>{action}</div>;}
function SectionTitle({title,action}){return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:16}}><h3 style={{fontSize:15,fontWeight:700,color:C.primary,margin:0}}>{title}</h3>{action}</div>;}
function Metric({label,value,sub,color,onClick}){return <div onClick={onClick} style={{background:color||"#f4f6f9",borderRadius:10,padding:"16px 20px",border:`1px solid ${C.border}`,cursor:onClick?"pointer":"default",transition:"box-shadow 0.15s"}} onMouseEnter={e=>{if(onClick)e.currentTarget.style.boxShadow="0 4px 12px rgba(0,0,0,0.1)"}} onMouseLeave={e=>e.currentTarget.style.boxShadow="none"}>
  <div style={{fontSize:12,color:C.muted,fontWeight:600,marginBottom:6}}>{label}</div>
  <div style={{fontSize:22,fontWeight:700,color:C.primary}}>{value}</div>
  {sub&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>{sub}</div>}
</div>;}

function Btn({children,onClick,v="primary",sm,danger,full,disabled}){
  const base={primary:{background:C.primary,color:"#fff",border:"none"},accent:{background:C.accent,color:"#fff",border:"none"},outline:{background:"#fff",color:C.primary,border:`1px solid ${C.primary}`},ghost:{background:"transparent",color:C.muted,border:`1px solid ${C.border}`},success:{background:C.success,color:"#fff",border:"none"}};
  const s=base[v]||base.primary;
  return <button onClick={onClick} disabled={disabled} style={{...s,...(danger?{background:"#fff",color:C.danger,border:`1px solid ${C.danger}`}:{}),cursor:disabled?"not-allowed":"pointer",opacity:disabled?0.6:1,borderRadius:8,padding:sm?"5px 12px":"9px 18px",fontSize:sm?12:13,fontWeight:600,whiteSpace:"nowrap",width:full?"100%":"auto",transition:"opacity 0.15s"}}>{children}</button>;
}

function Inp({label,value,onChange,type="text",opts,req,ph,hint,readOnly,half}){
  return <div style={{display:"flex",flexDirection:"column",gap:5,gridColumn:half?"span 1":""}}>
    <label style={{fontSize:12,fontWeight:600,color:C.muted}}>{label}{req&&<span style={{color:C.danger}}> *</span>}</label>
    {opts?<select value={value} onChange={e=>onChange&&onChange(e.target.value)} disabled={readOnly} style={{padding:"8px 10px",borderRadius:7,border:`1px solid ${readOnly?"#e8eaed":C.border}`,fontSize:13,color:C.text,background:readOnly?"#f8f9fa":"#fff"}}>
        <option value="">Select…</option>
        {opts.map(o=><option key={o.value||o} value={o.value||o}>{o.label||o}</option>)}
      </select>
    :<input type={type} value={value} placeholder={ph||""} readOnly={readOnly} onChange={e=>onChange&&onChange(e.target.value)} style={{padding:"8px 10px",borderRadius:7,border:`1px solid ${readOnly?"#e8eaed":C.border}`,fontSize:13,color:C.text,background:readOnly?"#f8f9fa":"#fff"}}/>}
    {hint&&<span style={{fontSize:11,color:C.muted}}>{hint}</span>}
  </div>;
}

function TH({cols}){return <thead><tr>{cols.map((h,i)=><th key={i} style={{padding:"9px 12px",background:"#f4f6f9",color:C.muted,fontWeight:600,textAlign:"left",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap",fontSize:12}}>{h}</th>)}</tr></thead>;}
function TR({cells,onClick}){return <tr onClick={onClick} style={{borderBottom:`1px solid ${C.border}`,cursor:onClick?"pointer":"default",transition:"background 0.1s"}} onMouseEnter={e=>{if(onClick)e.currentTarget.style.background="#f8fafd"}} onMouseLeave={e=>e.currentTarget.style.background=""}>{cells.map((c,i)=><td key={i} style={{padding:"10px 12px",fontSize:13,verticalAlign:"middle"}}>{c}</td>)}</tr>;}

function Modal({title,onClose,children,wide}){
  return <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal fade" style={{maxWidth:wide?720:520}}>
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:22}}>
        <h3 style={{fontSize:17,fontWeight:700,color:C.primary}}>{title}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:24,color:C.muted,lineHeight:1,cursor:"pointer",padding:"0 4px"}}>×</button>
      </div>
      {children}
    </div>
  </div>;
}
function ConfirmDel({msg,onConfirm,onClose}){
  return <Modal title="Confirm Delete" onClose={onClose}>
    <p style={{fontSize:13,color:C.muted,marginBottom:22,lineHeight:1.6}}>{msg}</p>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <Btn v="ghost" onClick={onClose}>Cancel</Btn>
      <Btn danger onClick={onConfirm}>Yes, Delete</Btn>
    </div>
  </Modal>;
}
function FormGrid({children}){return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:14,marginBottom:18}}>{children}</div>;}
function FullCol({children}){return <div style={{gridColumn:"1/-1"}}>{children}</div>;}
function FormFooter({onCancel,onSave,saveLabel="Save"}){
  return <div style={{display:"flex",gap:10,justifyContent:"flex-end",paddingTop:4}}>
    <Btn v="ghost" onClick={onCancel}>Cancel</Btn>
    <Btn v="accent" onClick={onSave}>{saveLabel}</Btn>
  </div>;
}
function ActBtns({onEdit,onDel}){
  return <div style={{display:"flex",gap:6}}>
    <Btn sm v="outline" onClick={onEdit}>✏️ Edit</Btn>
    <Btn sm v="ghost" danger onClick={onDel}>🗑️</Btn>
  </div>;
}
function Alert({type,children}){
  const styles={warn:{bg:C.wBg,border:C.wBd,color:C.wTx,icon:"⚠️"},danger:{bg:C.dBg,border:"#f5b0b0",color:C.danger,icon:"🚨"},info:{bg:C.iBg,border:"#a5c2f2",color:C.info,icon:"ℹ️"},success:{bg:C.sBg,border:"#aedcc2",color:C.success,icon:"✓"}};
  const s=styles[type]||styles.info;
  return <div style={{background:s.bg,border:`1px solid ${s.border}`,borderRadius:9,padding:"10px 14px",fontSize:13,color:s.color,marginBottom:14,display:"flex",gap:8,alignItems:"flex-start"}}><span>{s.icon}</span><span>{children}</span></div>;
}

function Tabs({tabs,active,onChange}){
  return <div style={{display:"flex",gap:2,borderBottom:`2px solid ${C.border}`,marginBottom:20}}>
    {tabs.map(t=><button key={t.id} onClick={()=>onChange(t.id)} style={{padding:"9px 18px",fontSize:13,fontWeight:active===t.id?700:400,background:"none",border:"none",cursor:"pointer",color:active===t.id?C.primary:C.muted,borderBottom:active===t.id?`2px solid ${C.primary}`:"2px solid transparent",marginBottom:-2,whiteSpace:"nowrap"}}>{t.label}</button>)}
  </div>;
}

/* ─────────────────────────────────────────
   DATA HOOKS
───────────────────────────────────────── */
function useData(key){
  const [data,setData]=useState(()=>LS.get(key)||[]);
  const save=useCallback(next=>{setData(next);LS.set(key,next);},[key]);
  const add=item=>{const next=[...data,{...item,id:uid()}];save(next);};
  const update=(id,item)=>{const next=data.map(x=>x.id===id?{...item,id}:x);save(next);};
  const remove=id=>{const next=data.filter(x=>x.id!==id);save(next);};
  return{data,save,add,update,remove};
}

/* ─────────────────────────────────────────
   LOGIN
───────────────────────────────────────── */
function Login({onLogin,brand}){
  const B=brand||DEFAULT_BRAND;
  const [tab,setTab]=useState("login");
  // Login state
  const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState(""),[show,setShow]=useState(false);
  // Register state
  const [reg,setReg]=useState({name:"",driverID:"",username:"",password:"",confirmPassword:""});
  const [regErr,setRegErr]=useState(""),[regOk,setRegOk]=useState(false),[showReg,setShowReg]=useState(false);
  const rf=k=>v=>setReg(r=>({...r,[k]:v}));

  const go=()=>{
    const users=LS.get("users")||[];
    const user=users.find(x=>x.username===u.trim()&&x.password===p);
    if(!user){setErr("Invalid username or password.");setP("");return;}
    if(user.status==="pending"){setErr("Your account is pending approval by the General Manager. Please wait.");return;}
    if(user.status==="suspended"){setErr("Your account has been suspended. Please contact the General Manager.");return;}
    onLogin(user);
  };

  const register=()=>{
    setRegErr("");
    if(!reg.name||!reg.username||!reg.password)return setRegErr("Full name, username and password are required.");
    if(reg.password!==reg.confirmPassword)return setRegErr("Passwords do not match.");
    if(reg.password.length<4)return setRegErr("Password must be at least 4 characters.");
    const users=LS.get("users")||[];
    if(users.find(u=>u.username===reg.username.trim()))return setRegErr("That username is already taken. Please choose another.");
    const newUser={id:uid(),role:ROLES.DRIVER,name:reg.name.trim(),driverID:reg.driverID.trim(),username:reg.username.trim(),password:reg.password,email:"",status:"pending",createdAt:today()};
    LS.set("users",[...users,newUser]);
    setRegOk(true);setReg({name:"",driverID:"",username:"",password:"",confirmPassword:""});
  };

  const Logo=()=><div style={{textAlign:"center",marginBottom:26}}>
    <div style={{width:60,height:60,borderRadius:14,background:B.accentColor,display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:900,fontSize:20,color:"#fff",marginBottom:14,boxShadow:`0 4px 16px ${B.accentColor}66`,overflow:"hidden"}}>
      {B.logoImage?<img src={B.logoImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span>{B.logoText||B.companyName.slice(0,3).toUpperCase()}</span>}
    </div>
    <div style={{fontSize:21,fontWeight:800,color:B.primaryColor}}>{B.companyName}</div>
    <div style={{fontSize:12,color:C.muted,marginTop:3}}>{B.address&&`📍 ${B.address}`}{B.address&&B.phone&&" • "}{B.phone&&`📞 ${B.phone}`}</div>
  </div>;

  const bgStyle=B.loginBg
    ?{backgroundImage:`url(${B.loginBg})`,backgroundSize:"cover",backgroundPosition:"center"}
    :{background:`linear-gradient(135deg,${B.primaryColor} 0%,#0f2540 100%)`};

  return <div style={{minHeight:"100vh",...bgStyle,display:"flex",alignItems:"center",justifyContent:"center",padding:16}}>
    <div style={{background:"#fff",borderRadius:18,padding:"36px 36px 28px",width:"100%",maxWidth:400,boxShadow:"0 24px 64px rgba(0,0,0,0.35)"}}>
      <Logo/>
      {/* Tab switcher */}
      <div style={{display:"flex",borderRadius:9,background:"#f4f6f9",padding:4,marginBottom:22,gap:4}}>
        {[{id:"login",label:"🔑 Sign In"},{id:"register",label:"📝 Register as Driver"}].map(t=>
          <button key={t.id} onClick={()=>{setTab(t.id);setErr("");setRegErr("");setRegOk(false);}} style={{flex:1,padding:"8px 0",borderRadius:7,border:"none",cursor:"pointer",fontWeight:tab===t.id?700:400,fontSize:12,background:tab===t.id?"#fff":"transparent",color:tab===t.id?C.primary:C.muted,boxShadow:tab===t.id?"0 1px 4px rgba(0,0,0,0.12)":"none",transition:"all 0.15s"}}>{t.label}</button>)}
      </div>

      {tab==="login"&&<div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Inp label="Username" value={u} onChange={setU} ph="Enter your username" req/>
        <div style={{display:"flex",flexDirection:"column",gap:5}}>
          <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Password <span style={{color:C.danger}}>*</span></label>
          <div style={{position:"relative"}}>
            <input type={show?"text":"password"} value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••" style={{width:"100%",padding:"8px 38px 8px 10px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:13}}/>
            <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,fontSize:14,cursor:"pointer"}}>{show?"🙈":"👁"}</button>
          </div>
        </div>
        {err&&<Alert type="danger">{err}</Alert>}
        <button onClick={go} style={{background:B.primaryColor,color:"#fff",border:"none",borderRadius:9,padding:12,fontSize:14,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 12px rgba(26,58,92,0.3)"}}>Sign In →</button>
      </div>}

      {tab==="register"&&<div style={{display:"flex",flexDirection:"column",gap:13}}>
        {regOk?<div style={{textAlign:"center",padding:"20px 0"}}>
          <div style={{fontSize:40,marginBottom:12}}>✅</div>
          <div style={{fontSize:16,fontWeight:700,color:C.success,marginBottom:8}}>Registration Submitted!</div>
          <div style={{fontSize:13,color:C.muted,lineHeight:1.6}}>Your account is <b>pending approval</b> by the General Manager. You will be able to log in once your account is approved.</div>
          <button onClick={()=>{setRegOk(false);setTab("login");}} style={{marginTop:18,background:C.primary,color:"#fff",border:"none",borderRadius:8,padding:"9px 20px",fontSize:13,fontWeight:600,cursor:"pointer"}}>Back to Sign In</button>
        </div>:<>
          <Alert type="info">Fill in your details below. Your account will be reviewed and approved by the General Manager before you can log in.</Alert>
          <Inp label="Full Name" value={reg.name} onChange={rf("name")} req ph="Your full name"/>
          <Inp label="Driver ID (if assigned)" value={reg.driverID} onChange={rf("driverID")} ph="e.g. DRV-106 (leave blank if unknown)"/>
          <Inp label="Choose Username" value={reg.username} onChange={rf("username")} req ph="Your login username"/>
          <div style={{display:"flex",flexDirection:"column",gap:5}}>
            <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Password <span style={{color:C.danger}}>*</span></label>
            <div style={{position:"relative"}}>
              <input type={showReg?"text":"password"} value={reg.password} onChange={e=>rf("password")(e.target.value)} placeholder="Min. 4 characters" style={{width:"100%",padding:"8px 38px 8px 10px",borderRadius:7,border:`1px solid ${C.border}`,fontSize:13}}/>
              <button onClick={()=>setShowReg(s=>!s)} style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,fontSize:14,cursor:"pointer"}}>{showReg?"🙈":"👁"}</button>
            </div>
          </div>
          <Inp label="Confirm Password" value={reg.confirmPassword} onChange={rf("confirmPassword")} type="password" req ph="Repeat your password"/>
          {regErr&&<Alert type="danger">{regErr}</Alert>}
          <button onClick={register} style={{background:C.success,color:"#fff",border:"none",borderRadius:9,padding:12,fontSize:14,fontWeight:700,cursor:"pointer"}}>Submit Registration →</button>
        </>}
      </div>}
    </div>
  </div>;
}

/* ═══════════════════════════════════════
   GM SETTINGS PAGE

function GMSettings({brand,onSave,currentUser}){
  const [f,setF]=useState({...brand});
  const [tab,setTab]=useState("branding");
  const [saved,setSaved]=useState(false);
  const [credSaved,setCredSaved]=useState(false);
  const [creds,setCreds]=useState({currentPassword:"",newPassword:"",confirmPassword:""});
  const [credErr,setCredErr]=useState("");
  const set=k=>v=>setF(p=>({...p,[k]:v}));
  const cf=k=>v=>setCreds(p=>({...p,[k]:v}));

  const upload=(key,maxKB)=>e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>maxKB*1024){alert(`Please use an image under ${maxKB}KB.`);e.target.value="";return;}
    const r=new FileReader();
    r.onload=ev=>setF(p=>({...p,[key]:ev.target.result}));
    r.readAsDataURL(file);e.target.value="";
  };

  const save=()=>{
    if(!f.companyName)return alert("Company name is required.");
    onSave(f);setSaved(true);setTimeout(()=>setSaved(false),3000);
  };

  const saveCreds=()=>{
    setCredErr("");
    const users=LS.get("users")||[];
    const me=users.find(u=>u.id===currentUser.id);
    if(!me)return setCredErr("Could not find your account.");
    if(creds.currentPassword!==me.password)return setCredErr("Current password is incorrect.");
    if(!creds.newPassword||creds.newPassword.length<4)return setCredErr("New password must be at least 4 characters.");
    if(creds.newPassword!==creds.confirmPassword)return setCredErr("New passwords do not match.");
    const updated=users.map(u=>u.id===me.id?{...u,password:creds.newPassword}:u);
    LS.set("users",updated);
    setCreds({currentPassword:"",newPassword:"",confirmPassword:""});
    setCredSaved(true);setTimeout(()=>setCredSaved(false),3000);
  };

  const TABS=[{id:"branding",label:"🎨 Logo & Branding"},{id:"backgrounds",label:"🖼️ Backgrounds"},{id:"contact",label:"📍 Contact Info"},{id:"credentials",label:"🔐 My Credentials"}];

  const ColorPicker=({label,k})=>(
    <div style={{display:"flex",flexDirection:"column",gap:6}}>
      <label style={{fontSize:12,fontWeight:600,color:C.muted}}>{label}</label>
      <div style={{display:"flex",gap:10,alignItems:"center"}}>
        <input type="color" value={f[k]} onChange={e=>set(k)(e.target.value)} style={{width:44,height:36,borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer",padding:2}}/>
        <span style={{fontSize:12,fontFamily:"monospace",color:C.muted}}>{f[k]}</span>
        <div style={{width:28,height:28,borderRadius:6,background:f[k],border:`1px solid ${C.border}`}}/>
      </div>
    </div>
  );

  const UploadField=({label,fieldKey,maxKB,hint})=>(
    <div style={{display:"flex",flexDirection:"column",gap:8}}>
      <label style={{fontSize:12,fontWeight:600,color:C.muted}}>{label}</label>
      <div style={{display:"flex",gap:10,alignItems:"center",flexWrap:"wrap"}}>
        <label style={{background:C.primary,color:"#fff",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer",display:"inline-block"}}>
          📁 Choose Image
          <input type="file" accept="image/png,image/jpeg,image/webp" onChange={upload(fieldKey,maxKB)} style={{display:"none"}}/>
        </label>
        {f[fieldKey]
          ?<><span style={{fontSize:12,color:C.success,fontWeight:600}}>✓ Image set</span>
            <button onClick={()=>setF(p=>({...p,[fieldKey]:""}))} style={{background:"none",border:`1px solid ${C.danger}`,color:C.danger,borderRadius:6,padding:"5px 10px",fontSize:11,cursor:"pointer",fontWeight:600}}>✕ Remove</button></>
          :<span style={{fontSize:12,color:C.muted}}>No image set</span>}
      </div>
      {hint&&<span style={{fontSize:11,color:C.muted}}>{hint}</span>}
      {f[fieldKey]&&<div style={{width:"100%",height:100,borderRadius:9,overflow:"hidden",border:`1px solid ${C.border}`,backgroundImage:`url(${f[fieldKey]})`,backgroundSize:"cover",backgroundPosition:"center"}}/>}
    </div>
  );

  return <div className="fade" style={{maxWidth:680}}>
    <PageTitle title="⚙️ App Settings" sub="Customise branding, backgrounds and contact details. Changes apply across the entire platform instantly."/>

    {/* Live preview bar */}
    <Card style={{marginBottom:22,padding:"14px 18px"}}>
      <div style={{fontSize:11,fontWeight:700,color:C.muted,marginBottom:10,letterSpacing:"0.06em"}}>LIVE PREVIEW</div>
      <div style={{display:"flex",alignItems:"center",gap:14,background:f.primaryColor,borderRadius:10,padding:"12px 18px"}}>
        <div style={{width:44,height:44,borderRadius:10,background:f.accentColor,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
          {f.logoImage?<img src={f.logoImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontWeight:900,fontSize:13,color:"#fff"}}>{f.logoText||f.companyName.slice(0,3).toUpperCase()}</span>}
        </div>
        <div>
          <div style={{fontWeight:700,fontSize:16,color:"#fff"}}>{f.companyName||"Company Name"}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.7)"}}>{f.tagline}</div>
        </div>
        <div style={{marginLeft:"auto",fontSize:11,color:"rgba(255,255,255,0.75)",textAlign:"right"}}>
          {f.address&&<div>📍 {f.address}</div>}
          {f.phone&&<div>📞 {f.phone}</div>}
        </div>
      </div>
    </Card>

    {/* Tabs */}
    <div style={{display:"flex",gap:2,borderBottom:`2px solid ${C.border}`,marginBottom:22}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"9px 20px",fontSize:13,fontWeight:tab===t.id?700:400,background:"none",border:"none",cursor:"pointer",color:tab===t.id?C.primary:C.muted,borderBottom:tab===t.id?`2px solid ${C.primary}`:"2px solid transparent",marginBottom:-2,whiteSpace:"nowrap"}}>{t.label}</button>)}
    </div>

    {/* BRANDING TAB */}
    {tab==="branding"&&<Card>
      <SectionTitle title="Company Identity"/>
      <FormGrid>
        <Inp label="Company Name" value={f.companyName} onChange={set("companyName")} req/>
        <Inp label="App Tagline / Subtitle" value={f.tagline} onChange={set("tagline")}/>
        <Inp label="Logo Letters (if no image uploaded)" value={f.logoText} onChange={set("logoText")} ph="e.g. BYT"/>
      </FormGrid>
      <SectionTitle title="Colours" />
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:16,marginBottom:20}}>
        <ColorPicker label="Primary Colour (header & sidebar)" k="primaryColor"/>
        <ColorPicker label="Accent Colour (logo box & buttons)" k="accentColor"/>
      </div>
      <SectionTitle title="Logo Image"/>
      <UploadField label="Upload Logo (PNG/JPG, max 200KB)" fieldKey="logoImage" maxKB={200} hint="This replaces the logo letters everywhere — header, login screen and sidebar."/>
    </Card>}

    {/* BACKGROUNDS TAB */}
    {tab==="backgrounds"&&<div style={{display:"flex",flexDirection:"column",gap:18}}>
      <Card>
        <SectionTitle title="Login Screen Background"/>
        <p style={{fontSize:13,color:C.muted,marginBottom:16}}>This image appears behind the login card when users open the app. Recommended size: 1920×1080px.</p>
        <UploadField label="Upload Login Background (max 1.5MB)" fieldKey="loginBg" maxKB={1500} hint="PNG, JPG or WEBP. The gradient uses your primary colour if no image is set."/>
      </Card>
      <Card>
        <SectionTitle title="App / Dashboard Background"/>
        <p style={{fontSize:13,color:C.muted,marginBottom:16}}>Appears behind all portal pages. Use a subtle image so text stays readable.</p>
        <UploadField label="Upload App Background (max 1.5MB)" fieldKey="appBg" maxKB={1500} hint="Tip: low-contrast textures or slightly blurred photos work best."/>
      </Card>
    </div>}

    {/* CONTACT TAB */}
    {tab==="contact"&&<Card>
      <SectionTitle title="Contact Details"/>
      <p style={{fontSize:13,color:C.muted,marginBottom:16}}>These appear in the header and on the login screen for all users.</p>
      <FormGrid>
        <FullCol><Inp label="Address / Location" value={f.address} onChange={set("address")} ph="e.g. Kasoa, Ghana"/></FullCol>
        <Inp label="Phone Number" value={f.phone} onChange={set("phone")} ph="e.g. 0557086481"/>
        <Inp label="Email Address (optional)" value={f.email} onChange={set("email")} type="email" ph="info@company.gh"/>
      </FormGrid>
    </Card>}

    {/* CREDENTIALS TAB */}
    {tab==="credentials"&&<Card>
      <SectionTitle title="Change My Login Credentials"/>
      <p style={{fontSize:13,color:C.muted,marginBottom:18}}>Update the username and password you use to access the General Manager portal.</p>
      <div style={{display:"flex",flexDirection:"column",gap:14,maxWidth:400}}>
        <Inp label="Current Username" value={currentUser?.username||""} readOnly hint="Username cannot be changed here — use User Management to edit it."/>
        <Inp label="Current Password" value={creds.currentPassword} onChange={cf("currentPassword")} type="password" req ph="Enter your current password"/>
        <Inp label="New Password" value={creds.newPassword} onChange={cf("newPassword")} type="password" req ph="Min. 4 characters"/>
        <Inp label="Confirm New Password" value={creds.confirmPassword} onChange={cf("confirmPassword")} type="password" req ph="Repeat new password"/>
        {credErr&&<Alert type="danger">{credErr}</Alert>}
        <div style={{display:"flex",gap:12,alignItems:"center"}}>
          <button onClick={saveCreds} style={{background:C.primary,color:"#fff",border:"none",borderRadius:9,padding:"10px 22px",fontSize:13,fontWeight:700,cursor:"pointer"}}>🔐 Update Password</button>
          {credSaved&&<span style={{fontSize:13,color:C.success,fontWeight:700}}>✓ Password updated!</span>}
        </div>
      </div>
      <div style={{marginTop:24,padding:"12px 14px",background:C.wBg,border:`1px solid ${C.wBd}`,borderRadius:9,fontSize:12,color:C.wTx}}>
        ⚠️ Write down your new password before saving. To change your <b>username</b>, go to <b>User Management</b> and edit your account there.
      </div>
    </Card>}

    {/* Save bar — only shown on non-credentials tabs */}
    {tab!=="credentials"&&<div style={{display:"flex",gap:12,alignItems:"center",marginTop:22}}>
      <button onClick={save} style={{background:C.primary,color:"#fff",border:"none",borderRadius:9,padding:"11px 28px",fontSize:14,fontWeight:700,cursor:"pointer",boxShadow:"0 4px 12px rgba(26,58,92,0.2)"}}>💾 Save Changes</button>
      <button onClick={()=>setF({...DEFAULT_BRAND})} style={{background:"#fff",color:C.muted,border:`1px solid ${C.border}`,borderRadius:9,padding:"11px 18px",fontSize:13,cursor:"pointer"}}>Reset to Defaults</button>
      {saved&&<span style={{fontSize:13,color:C.success,fontWeight:700}}>✓ Settings saved! Changes are live.</span>}
    </div>}
  </div>;
}

    {id:"oil",icon:"🛢️",label:"Oil Records"},

    finance:<GMFinance driverSales={driverSales} driverExpenses={driverExpenses} opsSales={opsSales} parts={parts} oil={oil} payments={payments}/>,

function GMDashboard({users,drivers,carInfo,driverSales,driverExpenses,opsSales,parts,oil,insurance,logs,payments}){
  const thisWeek=WEEKS[0];
  const weekSales=driverSales.filter(s=>s.week===thisWeek);
  const totalRev=weekSales.reduce((a,b)=>a+Number(b.amount||0),0);
  const totalOil=oil.filter(o=>o.week===thisWeek).reduce((a,b)=>a+Number(b.total||0),0);
  const totalParts=parts.filter(p=>p.week===thisWeek).reduce((a,b)=>a+Number(b.total||0),0);
  const totalPay=payments.filter(p=>p.week===thisWeek).reduce((a,b)=>a+Number(b.amount||0),0);
  const totalDrvExp=(driverExpenses||[]).filter(e=>e.week===thisWeek).reduce((a,b)=>a+Number(b.amount||0),0);
  const totalOut=totalOil+totalParts+totalPay+totalDrvExp;
  const net=totalRev-totalOut;
  const expIns=insurance.filter(i=>expiryStatus(i.expiryDate)==="Expired").length;
  const soonIns=insurance.filter(i=>expiryStatus(i.expiryDate)==="Expiring Soon").length;
  const openLogs=logs.filter(l=>l.status==="Open").length;
  const expRW=carInfo.filter(c=>expiryStatus(c.roadworthyExpiry)==="Expired"||expiryStatus(c.roadworthyExpiry)==="Expiring Soon").length;
  const pendingApprovals=(users||[]).filter(u=>u.status==="pending").length;

  return <div className="fade">
    <PageTitle title="General Manager Dashboard" sub={`${new Date().toDateString()} — ${thisWeek}`}/>
    {pendingApprovals>0&&<Alert type="warn"><b>{pendingApprovals} driver{pendingApprovals>1?"s":""}</b> ha{pendingApprovals>1?"ve":"s"} self-registered and {pendingApprovals>1?"are":"is"} awaiting your approval. Go to <b>User Management</b> to review.</Alert>}
    {(expIns>0||soonIns>0||openLogs>0||expRW>0)&&<Alert type="warn">
      {expIns>0&&<span><b>{expIns}</b> expired insurance. </span>}
      {soonIns>0&&<span><b>{soonIns}</b> insurance expiring soon. </span>}
      {openLogs>0&&<span><b>{openLogs}</b> open incidents. </span>}
      {expRW>0&&<span><b>{expRW}</b> roadworthy expired/expiring.</span>}
    </Alert>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:14,marginBottom:22}}>
      <Metric label="Total Drivers" value={drivers.length} sub="Active fleet drivers"/>
      <Metric label="Week Revenue" value={GHC(totalRev)} sub={`${weekSales.length} submissions`} color="#e9f5ee"/>
      <Metric label="Week Expenses" value={GHC(totalOut)} sub="Oil + Parts + Payments + Driver Exp." color="#fceaea"/>
      <Metric label="Net Profit" value={GHC(net)} sub="This week" color={net>=0?"#e9f5ee":"#fceaea"}/>
      <Metric label="Pending Approvals" value={pendingApprovals} sub="Awaiting review" color={pendingApprovals>0?C.wBg:"#f4f6f9"}/>
      <Metric label="Open Issues" value={openLogs} sub="Incidents/accidents" color={openLogs>0?C.wBg:"#f4f6f9"}/>

function GMFinance({driverSales,driverExpenses,opsSales,parts,oil,payments}){
  const bRef=useRef(),charts=useRef({});
  const wks=WEEKS.slice(0,8).reverse();
  const wd=wks.map(wk=>({
    wk,rev:driverSales.filter(s=>s.week===wk).reduce((a,b)=>a+Number(b.amount||0),0),
    oil:oil.filter(o=>o.week===wk).reduce((a,b)=>a+Number(b.total||0),0),
    pts:parts.filter(p=>p.week===wk).reduce((a,b)=>a+Number(b.total||0),0),
    pay:payments.filter(p=>p.week===wk).reduce((a,b)=>a+Number(b.amount||0),0),
    drvExp:(driverExpenses||[]).filter(e=>e.week===wk).reduce((a,b)=>a+Number(b.amount||0),0),
  }));
  const labs=wks.map(w=>w.replace(/\d{4}/,"").trim());
  useEffect(()=>{
    Object.values(charts.current).forEach(c=>c?.destroy());
    if(bRef.current){charts.current.b=new Chart(bRef.current,{type:"bar",data:{labels:labs,datasets:[{label:"Revenue",data:wd.map(d=>d.rev),backgroundColor:"rgba(26,122,74,0.8)",borderRadius:4},{label:"Total Out",data:wd.map(d=>d.oil+d.pts+d.pay),backgroundColor:"rgba(185,48,48,0.75)",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},scales:{y:{beginAtZero:true,ticks:{callback:v=>"GH₵"+v.toLocaleString()}},x:{grid:{display:false}}}}});}
    return()=>Object.values(charts.current).forEach(c=>c?.destroy());
  },[JSON.stringify(wd)]);
  const tot=wd.reduce((a,d)=>({rev:a.rev+d.rev,out:a.out+d.oil+d.pts+d.pay+d.drvExp}),{rev:0,out:0});
  return <div className="fade">
    <PageTitle title="Financial Overview" sub="Revenue and expenses across all weeks"/>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:14,marginBottom:22}}>
      <Metric label="Total Revenue (8wk)" value={GHC(tot.rev)} color="#e9f5ee"/>
      <Metric label="Total Expenses (8wk)" value={GHC(tot.out)} color="#fceaea"/>
      <Metric label="Net Profit (8wk)" value={GHC(tot.rev-tot.out)} color={(tot.rev-tot.out)>=0?"#e9f5ee":"#fceaea"}/>
    </div>
    <Card style={{marginBottom:20}}>
      <SectionTitle title="Revenue vs Expenses by Week"/>
      <div style={{height:300}}><canvas ref={bRef}/></div>
    </Card>
    <Card>
      <SectionTitle title="Weekly Breakdown"/>
      <div style={{overflowX:"auto"}}><table><TH cols={["Week","Revenue","Oil","Parts","Payments","Driver Exp.","Total Out","Net"]}/>
      <tbody>{wd.slice().reverse().map((d,i)=>{const o=d.oil+d.pts+d.pay+d.drvExp,n=d.rev-o;return<TR key={i} cells={[d.wk,<span style={{color:C.success,fontWeight:600}}>{GHC(d.rev)}</span>,GHC(d.oil),GHC(d.pts),GHC(d.pay),GHC(d.drvExp),<span style={{color:C.danger,fontWeight:600}}>{GHC(o)}</span>,<span style={{color:n>=0?C.success:C.danger,fontWeight:700}}>{GHC(n)}</span>]}/>;})}</tbody></table></div>
    </Card>
  </div>;
}

function GMFleet({carInfo,saveCarInfo,drivers,insurance}){
  const blank={carNumber:"",plate:"",make:"",color:"",licenseNo:"",licenseExpiry:"",roadworthyIssued:"",roadworthyExpiry:"",driverID:""};
  const [M,setM]=useState(null),[del,setDel]=useState(null);
  const f=k=>v=>setM(m=>({...m,data:{...m.data,[k]:v}}));

  const save=()=>{
    const d=M.data;
    if(!d.carNumber||!d.plate)return alert("Car number and plate number are required.");
    const exists=carInfo.find(c=>c.carNumber===d.carNumber.trim()&&c.id!==d.id);
    if(exists)return alert("A car with that number already exists.");
    const item={...d,carNumber:d.carNumber.trim(),updatedAt:today()};
    let next;
    if(M.mode==="add") next=[...carInfo,{...item,id:uid()}];
    else next=carInfo.map(c=>c.id===d.id?{...item,id:d.id}:c);
    saveCarInfo(next);setM(null);
  };

  const remove=id=>{saveCarInfo(carInfo.filter(c=>c.id!==id));setDel(null);};

  const driverOpts=[{value:"",label:"— Unassigned —"},...drivers.filter(d=>(d.status||"active")==="active").map(d=>({value:d.id,label:`${d.name} (${d.driverID||d.username})`}))];

  return <div className="fade">
    <PageTitle title="Fleet Management" sub="Add, edit, assign and manage all company vehicles"
      action={<Btn onClick={()=>setM({mode:"add",data:{...blank}})}>+ Add Vehicle</Btn>}/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:14,marginBottom:20}}>
      <Metric label="Total Vehicles" value={carInfo.length} sub="In fleet"/>
      <Metric label="Assigned" value={carInfo.filter(c=>c.driverID).length} sub="With driver" color={C.sBg}/>
      <Metric label="Unassigned" value={carInfo.filter(c=>!c.driverID).length} sub="No driver" color={carInfo.filter(c=>!c.driverID).length>0?C.wBg:"#f4f6f9"}/>
      <Metric label="RW Expiring" value={carInfo.filter(c=>expiryStatus(c.roadworthyExpiry)==="Expired"||expiryStatus(c.roadworthyExpiry)==="Expiring Soon").length} sub="Needs attention" color={carInfo.filter(c=>expiryStatus(c.roadworthyExpiry)!=="Active"&&expiryStatus(c.roadworthyExpiry)!=="Unknown").length>0?C.dBg:"#f4f6f9"}/>
    </div>

    <Card>
      <div style={{overflowX:"auto"}}><table><TH cols={["Car No.","Plate","Make","Colour","Assigned Driver","Licence Expiry","RW Issued","RW Expiry","RW Status","Ins. Status","Actions"]}/>
      <tbody>{carInfo.length===0&&<TR cells={[<span style={{color:C.muted,fontStyle:"italic"}}>No vehicles yet. Click "+ Add Vehicle" to get started.</span>,...Array(10).fill("")]}/>}
      {carInfo.map((c,i)=>{
        const drv=drivers.find(d=>d.id===c.driverID);
        const ins=insurance.find(x=>x.carNumber===c.carNumber);
        const rwSt=expiryStatus(c.roadworthyExpiry);
        const insSt=ins?expiryStatus(ins.expiryDate):"Unknown";
        return <TR key={i} cells={[
          <b style={{color:C.primary}}>{c.carNumber}</b>,
          c.plate,c.make||"—",c.color||"—",
          drv?<span style={{color:C.success,fontWeight:600}}>{drv.name}</span>:<span style={{color:C.muted,fontSize:12}}>Unassigned</span>,
          c.licenseExpiry||"—",c.roadworthyIssued||"—",
          <b style={{color:rwSt==="Expired"?C.danger:rwSt==="Expiring Soon"?C.wTx:C.text}}>{c.roadworthyExpiry||"—"}</b>,
          <SBdg s={rwSt}/>,<SBdg s={insSt}/>,
          <ActBtns onEdit={()=>setM({mode:"edit",data:{...c}})} onDel={()=>setDel(c.id)}/>
        ]}/>;
      })}</tbody></table></div>
    </Card>

    {M&&<Modal title={M.mode==="add"?"Add New Vehicle":"Edit Vehicle"} onClose={()=>setM(null)} wide>
      <div style={{marginBottom:16,padding:"10px 14px",background:C.iBg,borderRadius:8,fontSize:12,color:C.info}}>
        ℹ️ Fields marked with * are required. Drivers can also update their own car details when they log in.
      </div>
      <FormGrid>
        <Inp label="Car / Fleet Number" value={M.data.carNumber} onChange={f("carNumber")} req ph="e.g. BYT-006"/>
        <Inp label="Plate Number" value={M.data.plate} onChange={f("plate")} req ph="e.g. GR-5512-24"/>
        <Inp label="Make / Model" value={M.data.make} onChange={f("make")} ph="e.g. Toyota Sprinter"/>
        <Inp label="Colour" value={M.data.color} onChange={f("color")} ph="e.g. White"/>
        <Inp label="Assign Driver" value={M.data.driverID} onChange={f("driverID")} opts={driverOpts}/>
        <Inp label="Driver's Licence No." value={M.data.licenseNo||""} onChange={f("licenseNo")} ph="e.g. GH-1234567"/>
        <Inp label="Licence Expiry Date" value={M.data.licenseExpiry||""} onChange={f("licenseExpiry")} type="date"/>
        <Inp label="Roadworthy Issue Date" value={M.data.roadworthyIssued||""} onChange={f("roadworthyIssued")} type="date"/>
        <Inp label="Roadworthy Expiry Date" value={M.data.roadworthyExpiry||""} onChange={f("roadworthyExpiry")} type="date"/>
      </FormGrid>
      <FormFooter onCancel={()=>setM(null)} onSave={save}/>

}

function GMUsers({users,saveUsers,currentUser}){
  const [M,setM]=useState(null),[del,setDel]=useState(null),[err,setErr]=useState(""),[suspendID,setSuspendID]=useState(null);
  const blank={role:ROLES.DRIVER,username:"",password:"",name:"",driverID:"",email:""};
  const f=k=>v=>setM(m=>({...m,data:{...m.data,[k]:v}}));

  const pending=users.filter(u=>u.status==="pending");

  const approve=id=>{saveUsers(users.map(u=>u.id===id?{...u,status:"active",approvedAt:today(),approvedBy:currentUser.id}:u));};
  const reject=id=>{saveUsers(users.filter(u=>u.id!==id));};
  const suspend=id=>{saveUsers(users.map(u=>u.id===id?{...u,status:"suspended",suspendedAt:today()}:u));setSuspendID(null);};
  const reinstate=id=>{saveUsers(users.map(u=>u.id===id?{...u,status:"active",suspendedAt:null}:u));};
  const remove=id=>{saveUsers(users.filter(u=>u.id!==id));setDel(null);};

  const save=()=>{
    const d=M.data;
    if(!d.username||!d.password||!d.name)return setErr("Name, username and password are required.");
    if(M.mode==="add"){
      const exists=users.find(u=>u.username===d.username.trim());
      if(exists)return setErr("Username already taken.");
      saveUsers([...users,{...d,id:uid(),username:d.username.trim(),status:"active",createdAt:today()}]);
    }else{
      saveUsers(users.map(u=>u.id===M.data.id?{...d,id:M.data.id,status:u.status||"active"}:u));
    }
    setM(null);setErr("");
  };

  const statusBadge=u=>{
    const s=u.status||"active";
    if(s==="pending")return <Bdg label="Pending Approval" color={C.wTx} bg={C.wBg} border={C.wBd}/>;
    if(s==="suspended")return <Bdg label="Suspended" color={C.danger} bg={C.dBg} border="#f5b0b0"/>;
    return <Bdg label="Active" color={C.success} bg={C.sBg} border="#aedcc2"/>;
  };

  const roleGroups=[{role:ROLES.GM,label:"General Managers",icon:"👑"},{role:ROLES.OPS,label:"Operational Managers",icon:"🔧"},{role:ROLES.DRIVER,label:"Drivers",icon:"🚐"}];

  return <div className="fade">
    <PageTitle title="User Management" sub="Approve registrations, manage accounts and credentials"
      action={<Btn onClick={()=>{setErr("");setM({mode:"add",data:{...blank}});}}>+ Add User</Btn>}/>

    {/* PENDING APPROVALS */}
    {pending.length>0&&<Card style={{marginBottom:20,border:`2px solid ${C.wBd}`,background:C.wBg}}>
      <SectionTitle title={`⏳ Pending Driver Registrations (${pending.length})`}/>
      <Alert type="warn">The following drivers have self-registered and are awaiting your approval before they can log in.</Alert>
      <table><TH cols={["Name","Driver ID","Username","Registered","Actions"]}/>
      <tbody>{pending.map((u,i)=><TR key={i} cells={[
        <b>{u.name}</b>,
        u.driverID||<span style={{color:C.muted,fontSize:11}}>Not provided</span>,
        <span style={{fontFamily:"monospace"}}>{u.username}</span>,
        u.createdAt||"—",
        <div style={{display:"flex",gap:6}}>
          <Btn sm v="success" onClick={()=>approve(u.id)}>✓ Approve</Btn>
          <Btn sm v="ghost" danger onClick={()=>reject(u.id)}>✕ Reject</Btn>
        </div>
      ]}/>)}</tbody></table>
    </Card>}

    {/* ACTIVE & SUSPENDED USERS */}
    {roleGroups.map(({role,label,icon})=>{
      const group=users.filter(u=>u.role===role&&u.status!=="pending");
      return <Card key={role} style={{marginBottom:18}}>
        <SectionTitle title={`${icon} ${label} (${group.length})`}/>
        {group.length===0
          ?<p style={{fontSize:13,color:C.muted}}>No {label.toLowerCase()} yet.</p>
          :<table><TH cols={["Name",role===ROLES.DRIVER?"Driver ID":"","Username","Status","Added","Actions"]}/>
          <tbody>{group.map((u,i)=>{
            const isSuspended=(u.status||"active")==="suspended";
            return <TR key={i} cells={[
              <b>{u.name}</b>,
              role===ROLES.DRIVER?<span style={{fontFamily:"monospace",fontSize:12}}>{u.driverID||"—"}</span>:"",
              u.username,
              statusBadge(u),
              u.createdAt||"—",
              u.id!==currentUser.id
                ?<div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  <Btn sm v="outline" onClick={()=>{setErr("");setM({mode:"edit",data:{...u}});}}>✏️ Edit</Btn>
                  {isSuspended
                    ?<Btn sm v="success" onClick={()=>reinstate(u.id)}>↩ Reinstate</Btn>
                    :<Btn sm v="ghost" onClick={()=>setSuspendID(u.id)}>⏸ Suspend</Btn>}
                  <Btn sm v="ghost" danger onClick={()=>setDel(u.id)}>🗑️ Delete</Btn>
                </div>
                :<span style={{fontSize:11,color:C.muted,fontStyle:"italic"}}>Your account</span>
            ]}/>;
          })}</tbody></table>}
      </Card>;
    })}

    {/* Add/Edit Modal */}
    {M&&<Modal title={M.mode==="add"?"Add New User":"Edit User"} onClose={()=>setM(null)}>
      {err&&<Alert type="danger">{err}</Alert>}
      <FormGrid>
        <Inp label="Full Name" value={M.data.name} onChange={f("name")} req/>
        <Inp label="Role" value={M.data.role} onChange={f("role")} opts={[{value:ROLES.GM,label:"General Manager"},{value:ROLES.OPS,label:"Operational Manager"},{value:ROLES.DRIVER,label:"Driver"}]} req/>
        <Inp label="Username" value={M.data.username} onChange={f("username")} req ph="login username"/>
        <Inp label="Password" value={M.data.password} onChange={f("password")} type="password" req/>
        {M.data.role===ROLES.DRIVER&&<Inp label="Driver ID" value={M.data.driverID||""} onChange={f("driverID")} ph="e.g. DRV-106"/>}
        <Inp label="Email (optional)" value={M.data.email||""} onChange={f("email")} type="email"/>
      </FormGrid>
      <FormFooter onCancel={()=>setM(null)} onSave={save}/>
    </Modal>}

    {/* Suspend confirm */}
    {suspendID&&<Modal title="Suspend Account?" onClose={()=>setSuspendID(null)}>
      <p style={{fontSize:13,color:C.muted,marginBottom:8,lineHeight:1.6}}>This driver will be <b>immediately logged out</b> and unable to sign in until reinstated. All their submitted data will be kept.</p>
      <Alert type="warn">You can reinstate the account at any time from this page.</Alert>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:16}}>
        <Btn v="ghost" onClick={()=>setSuspendID(null)}>Cancel</Btn>
        <Btn danger onClick={()=>suspend(suspendID)}>⏸ Suspend Account</Btn>
      </div>
    </Modal>}

    {/* Delete confirm */}
    {del&&<ConfirmDel msg="This will permanently delete the user account. Their submitted data (sales, car info) will remain on record." onConfirm={()=>remove(del)} onClose={()=>setDel(null)}/>}
  </div>;
}

function OpsPortal({user,onLogout,brand}){
  const [page,setPage]=useState("dashboard");
  const {data:opsSales,add:addOSale,update:updateOSale,remove:removeOSale}=useData("opsSales");
  const {data:parts,add:addPart,update:updatePart,remove:removePart}=useData("parts");
  const {data:oil,add:addOil,update:updateOil,remove:removeOil}=useData("oil");
  const {data:insurance,add:addIns,update:updateIns,remove:removeIns}=useData("insurance");
  const {data:logs,add:addLog,update:updateLog,remove:removeLog}=useData("logs");
  const {data:payments,add:addPayment,update:updatePayment,remove:removePayment}=useData("payments");
  const {data:driverSales}=useData("driverSales");
  const {data:driverExpenses}=useData("driverExpenses");
  const {data:carInfo}=useData("carInfo");
  const {data:users}=useData("users");
  const drivers=users.filter(u=>u.role===ROLES.DRIVER);

  const nav=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {section:true,label:"INPUT"},
    {id:"sales",icon:"💰",label:"Total Sales"},
    {id:"parts",icon:"🔧",label:"Car Parts & Maintenance"},
    {id:"oil",icon:"🛢️",label:"Oil Changes"},
    {id:"insurance",icon:"🛡️",label:"Insurance"},
    {id:"payments",icon:"💳",label:"Payments to Others"},
    {id:"logs",icon:"📝",label:"Report / Issue Log"},
    {section:true,label:"VIEW"},
    {id:"drvexpenses",icon:"🧾",label:"Driver Expenses"},
  ];

  const pages={
    dashboard:<OpsDashboard driverSales={driverSales} driverExpenses={driverExpenses} parts={parts} oil={oil} payments={payments} insurance={insurance} logs={logs} carInfo={carInfo}/>,
    sales:<OpsSales opsSales={opsSales} addOSale={addOSale} updateOSale={updateOSale} removeOSale={removeOSale} user={user}/>,
    parts:<OpsParts parts={parts} addPart={addPart} updatePart={updatePart} removePart={removePart} carInfo={carInfo} user={user}/>,
    oil:<OpsOil oil={oil} addOil={addOil} updateOil={updateOil} removeOil={removeOil} user={user}/>,
    insurance:<OpsInsurance insurance={insurance} addIns={addIns} updateIns={updateIns} removeIns={removeIns} carInfo={carInfo} user={user}/>,
    payments:<OpsPayments payments={payments} addPayment={addPayment} updatePayment={updatePayment} removePayment={removePayment} user={user}/>,
    logs:<OpsLogs logs={logs} addLog={addLog} updateLog={updateLog} removeLog={removeLog} carInfo={carInfo} user={user}/>,
    drvexpenses:<GMDriverExpenses driverExpenses={driverExpenses} drivers={drivers} carInfo={carInfo}/>,
  };

  return <Shell user={user} onLogout={onLogout} nav={nav} activePage={page} setPage={setPage} brand={brand}>
    {pages[page]||pages.dashboard}
  </Shell>;
}

function OpsDashboard({driverSales,parts,oil,payments,insurance,logs,carInfo}){
  const wk=WEEKS[0];
  const rev=driverSales.filter(s=>s.week===wk).reduce((a,b)=>a+Number(b.amount||0),0);
  const tO=oil.filter(o=>o.week===wk).reduce((a,b)=>a+Number(b.total||0),0);
  const tP=parts.filter(p=>p.week===wk).reduce((a,b)=>a+Number(b.total||0),0);
  const tPy=payments.filter(p=>p.week===wk).reduce((a,b)=>a+Number(b.amount||0),0);
  const openLogs=logs.filter(l=>l.status==="Open").length;
  const expIns=insurance.filter(i=>expiryStatus(i.expiryDate)==="Expired").length;
  return <div className="fade">
    <PageTitle title="Operations Dashboard" sub={`${WEEKS[0]} — ${new Date().toDateString()}`}/>
    {(expIns>0||openLogs>0)&&<Alert type="warn">{expIns>0&&<span><b>{expIns}</b> expired insurance policies. </span>}{openLogs>0&&<span><b>{openLogs}</b> open incidents awaiting resolution.</span>}</Alert>}
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:14,marginBottom:22}}>
      <Metric label="Driver Revenue (Week)" value={GHC(rev)} sub="From driver submissions" color="#e9f5ee"/>
      <Metric label="Oil Cost (Week)" value={GHC(tO)} sub="Fleet oil purchase"/>
      <Metric label="Parts Cost (Week)" value={GHC(tP)} sub="Maintenance & parts"/>
      <Metric label="Payments (Week)" value={GHC(tPy)} sub="To external parties"/>
      <Metric label="Open Issues" value={openLogs} color={openLogs>0?C.wBg:"#f4f6f9"} sub="Incidents/accidents"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card>
        <SectionTitle title="Insurance Alerts"/>
        {insurance.map(ins=>{const st=expiryStatus(ins.expiryDate);return(st!=="Active"&&st!=="Unknown")&&<div key={ins.id} style={{padding:"8px 0",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13}}><span><b>{ins.carNumber}</b> — expires {ins.expiryDate}</span><SBdg s={st}/></div>;})}
        {expIns===0&&insurance.filter(i=>expiryStatus(i.expiryDate)==="Expiring Soon").length===0&&<p style={{color:C.muted,fontSize:13,paddingTop:8}}>✓ All insurance policies active</p>}
      </Card>
      <Card>
        <SectionTitle title="Roadworthy Alerts"/>
        {carInfo.map(c=>{const st=expiryStatus(c.roadworthyExpiry);return(st!=="Active"&&st!=="Unknown")&&<div key={c.id} style={{padding:"8px 0",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center",fontSize:13}}><span><b>{c.carNumber}</b> — expires {c.roadworthyExpiry}</span><SBdg s={st}/></div>;})}
        {carInfo.filter(c=>expiryStatus(c.roadworthyExpiry)!=="Active"&&expiryStatus(c.roadworthyExpiry)!=="Unknown").length===0&&<p style={{color:C.muted,fontSize:13,paddingTop:8}}>✓ All roadworthy certificates active</p>}
      </Card>
    </div>
  </div>;
}

function DriverPortal({user,onLogout,brand}){
  const [page,setPage]=useState("dashboard");
  const {data:carInfoAll,save:saveCarInfo}=useData("carInfo");
  const {data:salesAll,save:saveSalesAll}=useData("driverSales");
  const {data:expAll,save:saveExpAll}=useData("driverExpenses");

  const myCarInfo=carInfoAll.find(c=>c.driverID===user.id)||null;
  const mySales=salesAll.filter(s=>s.driverID===user.id);
  const myExpenses=expAll.filter(e=>e.driverID===user.id);

  const saveCarInfoForMe=(newInfo)=>{
    const rest=carInfoAll.filter(c=>c.driverID!==user.id);
    saveCarInfo([...rest,{...newInfo,driverID:user.id,updatedAt:today()}]);
  };
  const addSale=item=>saveSalesAll([...salesAll,{...item,id:uid(),driverID:user.id,submittedAt:today()}]);
  const updateSale=(id,item)=>saveSalesAll(salesAll.map(s=>s.id===id?{...item,id,driverID:user.id}:s));
  const removeSale=id=>saveSalesAll(salesAll.filter(s=>s.id!==id));

  const addExpense=item=>saveExpAll([...expAll,{...item,id:uid(),driverID:user.id,carNumber:myCarInfo?.carNumber||"",submittedAt:today()}]);
  const updateExpense=(id,item)=>saveExpAll(expAll.map(e=>e.id===id?{...item,id,driverID:user.id}:e));
  const removeExpense=id=>saveExpAll(expAll.filter(e=>e.id!==id));

  const nav=[
    {id:"dashboard",icon:"📊",label:"My Dashboard"},
    {id:"carinfo",icon:"🚐",label:"My Car & Documents"},
    {id:"sales",icon:"💰",label:"My Weekly Sales"},
    {id:"expenses",icon:"🧾",label:"My Expenses"},
  ];

  const pages={
    dashboard:<DriverDashboard user={user} myCarInfo={myCarInfo} mySales={mySales} myExpenses={myExpenses}/>,
    carinfo:<DriverCarInfo user={user} myCarInfo={myCarInfo} carInfoAll={carInfoAll} onSave={saveCarInfoForMe}/>,
    sales:<DriverSales user={user} mySales={mySales} addSale={addSale} updateSale={updateSale} removeSale={removeSale}/>,
    expenses:<DriverExpenses user={user} myExpenses={myExpenses} myCarInfo={myCarInfo} addExpense={addExpense} updateExpense={updateExpense} removeExpense={removeExpense}/>,
  };

  return <Shell user={user} onLogout={onLogout} nav={nav} activePage={page} setPage={setPage} brand={brand}>
    {pages[page]||pages.dashboard}
  </Shell>;
}

  const licStatus=myCarInfo?expiryStatus(myCarInfo.licenseExpiry):"Unknown";
  return <div className="fade">
    <PageTitle title={`Welcome, ${user.name}`} sub={`Driver ID: ${user.driverID||"—"} — ${new Date().toDateString()}`}/>

    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(155px,1fr))",gap:14,marginBottom:22}}>
      <Metric label="Total Earned" value={GHC(totalEarned)} sub="All time" color="#e9f5ee"/>
      <Metric label="This Week" value={thisWeekSale?GHC(thisWeekSale.amount):"Not submitted"} sub={WEEKS[0]}/>
      <Metric label="This Week Expenses" value={GHC(thisWeekExp)} sub="Your vehicle costs" color={thisWeekExp>0?"#fceaea":"#f4f6f9"}/>
      <Metric label="Roadworthy" value={rwStatus} sub={myCarInfo?.roadworthyExpiry||"Not set"} color={rwStatus==="Active"?C.sBg:rwStatus==="Unknown"?"#f4f6f9":C.dBg}/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card>
        <SectionTitle title="My Vehicle"/>
        {myCarInfo?<div style={{display:"flex",flexDirection:"column",gap:10}}>
          {[["Car Number",myCarInfo.carNumber],["Plate",myCarInfo.plate],["Make",myCarInfo.make],["Licence No.",myCarInfo.licenseNo],["Licence Expiry",myCarInfo.licenseExpiry],["Roadworthy Expiry",myCarInfo.roadworthyExpiry]].map(([l,v],i)=><div key={i} style={{display:"flex",justifyContent:"space-between",borderBottom:`1px solid ${C.border}`,paddingBottom:8,fontSize:13}}><span style={{color:C.muted}}>{l}</span><b>{v||"—"}</b></div>)}
        </div>:<p style={{color:C.muted,fontSize:13}}>No vehicle info yet. Go to <b>My Car & Documents</b>.</p>}
      </Card>
      <Card>
        <SectionTitle title="Recent Sales"/>
        {mySales.length>0?<table><TH cols={["Week","Trips","Amount"]}/>
        <tbody>{[...mySales].reverse().slice(0,6).map((s,i)=><TR key={i} cells={[s.week,s.trips,<span style={{color:C.success,fontWeight:600}}>{GHC(s.amount)}</span>]}/>)}</tbody></table>
        :<p style={{color:C.muted,fontSize:13}}>No sales submitted yet.</p>}
      </Card>
    </div>
  </div>;

    const d=M.data;

    const item={...d,amount:Number(d.amount),carNumber:myCarInfo?.carNumber||""};
    M.mode==="add"?addExpense(item):updateExpense(M.data.id,{...item,id:M.data.id});

  };
  const totalExp=(myExpenses||[]).reduce((a,b)=>a+Number(b.amount||0),0);
  const weeks=[...new Set((myExpenses||[]).map(e=>e.week))];

  return <div className="fade">

    {!myCarInfo&&<Alert type="warn">Please fill in your car details first in <b>My Car & Documents</b> so expenses can be linked to your vehicle.</Alert>}

    {weeks.length===0&&<Card><Alert type="info">No expenses logged yet. Click <b>+ Add Expense</b> to record your first vehicle expense.</Alert></Card>}

    {weeks.map(wk=>{
      const rows=(myExpenses||[]).filter(e=>e.week===wk);
      const wkTot=rows.reduce((a,b)=>a+Number(b.amount||0),0);
      return <Card key={wk} style={{marginBottom:16}}>
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
          <b style={{color:C.primary,fontSize:14}}>{wk}</b>
          <span style={{color:C.danger,fontWeight:700}}>{GHC(wkTot)}</span>
        </div>
        <table><TH cols={["Category","Description","Amount","Date",""]}/>
        <tbody>{rows.map((r,i)=><TR key={i} cells={[
          <Bdg label={r.category} color={C.info} bg={C.iBg} border="#b5c8f0"/>,
          r.description||"—",
          <span style={{color:C.danger,fontWeight:600}}>{GHC(r.amount)}</span>,
          r.submittedAt||"—",
          <ActBtns onEdit={()=>setM({mode:"edit",data:{...r,amount:String(r.amount)}})} onDel={()=>setDel(r.id)}/>
        ]}/>)}</tbody></table>
      </Card>;
    })}

    {M&&<Modal title={M.mode==="add"?"Add Expense":"Edit Expense"} onClose={()=>setM(null)}>
      <FormGrid>
        <Inp label="Week" value={M.data.week} onChange={f("week")} opts={WEEKS} req/>
        <Inp label="Category" value={M.data.category} onChange={f("category")} opts={CATS} req/>
        <FullCol><Inp label="Description (optional)" value={M.data.description} onChange={f("description")} ph="e.g. Fuel on Kasoa–Accra route"/></FullCol>
        <Inp label="Amount (GH₵)" value={M.data.amount} onChange={f("amount")} type="number" req/>
      </FormGrid>
      <FormFooter onCancel={()=>setM(null)} onSave={save} saveLabel="Submit"/>
    </Modal>}
    {del&&<ConfirmDel msg="Delete this expense record?" onConfirm={()=>{removeExpense(del);setDel(null);}} onClose={()=>setDel(null)}/>}
  </div>;
}

/* ═══════════════════════════════════════
   ROOT APP
═══════════════════════════════════════ */
function App(){
  const [brand,setBrand]=useState(loadBrand);
  const [user,setUser]=useState(()=>{
    const saved=LS.get("session");
    if(!saved)return null;
    const users=LS.get("users")||[];
    return users.find(u=>u.id===saved)||null;
  });
  const login=u=>{setUser(u);LS.set("session",u.id);};
  const logout=()=>{setUser(null);LS.set("session",null);};
  const updateBrand=b=>{setBrand(b);saveBrand(b);};

  if(!user)return <Login onLogin={login} brand={brand}/>;
  if(user.role===ROLES.GM)return <GMPortal user={user} onLogout={logout} brand={brand} onBrandUpdate={updateBrand}/>;
  if(user.role===ROLES.OPS)return <OpsPortal user={user} onLogout={logout} brand={brand}/>;
  if(user.role===ROLES.DRIVER)return <DriverPortal user={user} onLogout={logout} brand={brand}/>;
  return <Login onLogin={login} brand={brand}/>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>

}
