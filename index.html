// ─── STORAGE ──────────────────────────────────────────────────────────────

const save = (key,val) => LS.set(key,val);

// ─── HELPERS ──────────────────────────────────────────────────────────────
const GHC = n=>`GH₵ ${Number(n).toLocaleString("en-GH",{minimumFractionDigits:2})}`;
const uid = () => Date.now() + Math.random();

function Badge({label,color,bg,border}){
  return <span style={{fontSize:11,fontWeight:600,padding:"2px 10px",borderRadius:20,background:bg,color,border:`1px solid ${border}`,whiteSpace:"nowrap"}}>{label}</span>;
}
const SM={Active:[C.success,C.successBg,"#aedcc2"],Maintenance:[C.accent,C.warnBg,C.warnBorder],Paid:[C.success,C.successBg,"#aedcc2"],Pending:[C.warnText,C.warnBg,C.warnBorder],Open:[C.danger,C.dangerBg,"#f5b0b0"],"In Review":[C.info,C.infoBg,"#a5c2f2"],Resolved:[C.success,C.successBg,"#aedcc2"],Expired:[C.danger,C.dangerBg,"#f5b0b0"],"Expiring Soon":[C.warnText,C.warnBg,C.warnBorder],Unknown:[C.muted,"#f0f2f5","#c8cdd4"]};
function SBadge({s}){const[c,bg,b]=SM[s]||SM.Unknown;return <Badge label={s} color={c} bg={bg} border={b}/>;}
function Card({children,style}){return <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.border}`,padding:"20px 22px",...style}}>{children}</div>;}
function ST({title,action}){return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h2 style={{fontSize:17,fontWeight:700,color:C.primary,margin:0}}>{title}</h2>{action}</div>;}
function MC({label,value,sub,color}){return <div style={{background:color||"#f4f6f9",borderRadius:10,padding:"16px 20px",border:`1px solid ${C.border}`}}><div style={{fontSize:12,color:C.muted,fontWeight:600,marginBottom:6}}>{label}</div><div style={{fontSize:22,fontWeight:700,color:C.primary}}>{value}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>{sub}</div>}</div>;}
function Btn({children,onClick,variant="primary",small,danger}){
  const s={primary:{background:C.primary,color:"#fff",border:"none"},accent:{background:C.accent,color:"#fff",border:"none"},outline:{background:"#fff",color:C.primary,border:`1px solid ${C.primary}`},ghost:{background:"transparent",color:C.muted,border:`1px solid ${C.border}`}};
  const base=s[variant]||s.primary;
  const ds=danger?{background:"#fff",color:C.danger,border:`1px solid ${C.danger}`}:{};
  return <button onClick={onClick} style={{...base,...ds,cursor:"pointer",borderRadius:7,padding:small?"4px 10px":"8px 16px",fontSize:small?11:13,fontWeight:600,whiteSpace:"nowrap"}}>{children}</button>;
}
function Inp({label,value,onChange,type="text",options,required,placeholder}){
  return <div style={{display:"flex",flexDirection:"column",gap:4}}>
    <label style={{fontSize:12,fontWeight:600,color:C.muted}}>{label}{required&&<span style={{color:C.danger}}> *</span>}</label>
    {options
      ?<select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text,background:"#fff"}}>
        <option value="">Select…</option>
        {options.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
      :<input type={type} value={value} placeholder={placeholder||""} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text}}/>}
  </div>;
}

// ─── MODAL ────────────────────────────────────────────────────────────────
function Modal({title,onClose,children}){
  return <div className="modal-overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal-box">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h3 style={{fontSize:16,fontWeight:700,color:C.primary}}>{title}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:20,color:C.muted,lineHeight:1,cursor:"pointer"}}>×</button>
      </div>
      {children}
    </div>
  </div>;
}

function getInsStatus(expiry){
  if(!expiry)return"Unknown";
  const d=Math.ceil((new Date(expiry)-new Date())/(86400000));
  return d<0?"Expired":d<=30?"Expiring Soon":"Active";
}

// ─── LOGIN PAGE ───────────────────────────────────────────────────────────
function LoginPage({onLogin,settings}){
  const S=settings||DEFAULT_SETTINGS;
  const [u,setU]=useState("");
  const [p,setP]=useState("");
  const [err,setErr]=useState("");
  const [show,setShow]=useState(false);
  const submit=()=>{
    if(u===S.adminUsername&&p===S.adminPassword){onLogin();}
    else{setErr("Invalid username or password.");setP("");}
  };
  return <div style={{minHeight:"100vh",background:S.loginBgImage?`url(${S.loginBgImage}) center/cover fixed`:`linear-gradient(135deg,${S.primaryColor} 0%,#2a5a8c 100%)`,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"#fff",borderRadius:16,padding:"40px 36px",width:360,boxShadow:"0 20px 60px rgba(0,0,0,0.25)"}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{width:56,height:56,borderRadius:14,background:S.accentColor,display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:20,color:"#fff",marginBottom:14,overflow:"hidden"}}>
          {S.logoImage?<img src={S.logoImage} alt="logo" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span>{S.logoText||S.companyName.slice(0,3).toUpperCase()}</span>}
        </div>
        <div style={{fontSize:20,fontWeight:700,color:S.primaryColor}}>{S.companyName}</div>
        <div style={{fontSize:13,color:C.muted,marginTop:4}}>{S.tagline}</div>
        <div style={{fontSize:11,color:C.muted,marginTop:2}}>{S.address&&`📍 ${S.address}`}{S.address&&S.phone&&" • "}{S.phone&&`📞 ${S.phone}`}</div>
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Inp label="Username" value={u} onChange={setU} placeholder="admin" required/>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Password <span style={{color:C.danger}}>*</span></label>
          <div style={{position:"relative"}}>
            <input type={show?"text":"password"} value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&submit()} placeholder="••••••••" style={{width:"100%",padding:"7px 36px 7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text}}/>
            <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,fontSize:14,cursor:"pointer"}}>{show?"🙈":"👁"}</button>
          </div>
        </div>
        {err&&<div style={{fontSize:12,color:C.danger,background:C.dangerBg,padding:"8px 12px",borderRadius:6}}>{err}</div>}
        <button onClick={submit} style={{background:C.primary,color:"#fff",border:"none",borderRadius:8,padding:"11px",fontSize:14,fontWeight:700,cursor:"pointer",marginTop:4}}>Sign In</button>
      </div>
      <div style={{marginTop:18,textAlign:"center",fontSize:11,color:C.muted}}>🔒 Restricted to authorised administrators only</div>
    </div>
  </div>;
}

// ─── DASHBOARD ────────────────────────────────────────────────────────────
function Dashboard({cars,sales,expenses,oil,salaries,parts,logs,payments}){
  const wk=WEEKS[0];
  const rev=sales.filter(s=>s.week===wk).reduce((a,b)=>a+b.revenue,0);
  const tOil=oil.filter(o=>o.week===wk).reduce((a,b)=>a+b.total,0);
  const tExp=expenses.filter(e=>e.week===wk).reduce((a,b)=>a+b.amount,0);
  const tSal=salaries.filter(s=>s.week===wk).reduce((a,b)=>a+b.total,0);
  const tPrt=parts.filter(p=>p.week===wk).reduce((a,b)=>a+b.total,0);
  const tPay=payments.filter(p=>p.week===wk).reduce((a,b)=>a+b.amount,0);
  const out=tOil+tExp+tSal+tPrt+tPay;
  const net=rev-out;
  const ws=sales.filter(s=>s.week===wk);
  const open=logs.filter(l=>l.status!=="Resolved").length;
  return <div style={{padding:24,display:"flex",flexDirection:"column",gap:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>Dashboard</h1>
        <p style={{margin:"4px 0 0",fontSize:13,color:C.muted}}>Current: {wk}</p></div>
      <div style={{fontSize:12,color:C.muted}}>{new Date().toDateString()}</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:14}}>
      <MC label="Weekly Revenue" value={GHC(rev)} sub={`${ws.length} drivers`}/>
      <MC label="Net Profit" value={GHC(net)} sub="After all expenses" color={net>=0?"#e9f5ee":"#fceaea"}/>
      <MC label="Fleet Size" value={cars.length} sub={`${cars.filter(c=>c.status==="Active").length} active`}/>
      <MC label="Open Issues" value={open} sub="Accidents & claims" color={open>0?C.warnBg:"#f4f6f9"}/>
      <MC label="Payroll Paid" value={GHC(salaries.filter(s=>s.week===wk&&s.status==="Paid").reduce((a,b)=>a+b.total,0))} sub="This week"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card>
        <ST title="Top Earners — This Week"/>
        <table style={{fontSize:13}}><thead><tr>{["Driver","Trips","Revenue"].map(h=><th key={h} style={{padding:"8px 12px",background:"#f4f6f9",color:C.muted,fontWeight:600,textAlign:"left",borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
        <tbody>{[...ws].sort((a,b)=>b.revenue-a.revenue).map((s,i)=><tr key={i} style={{borderBottom:`1px solid ${C.border}`}}><td style={{padding:"9px 12px"}}>{s.driver}</td><td style={{padding:"9px 12px"}}>{s.trips}</td><td style={{padding:"9px 12px",color:C.success,fontWeight:600}}>{GHC(s.revenue)}</td></tr>)}</tbody></table>
      </Card>
      <Card>
        <ST title="Expense Breakdown"/>
        {[["Oil",tOil],["Salaries",tSal],["Parts",tPrt],["Payments to Others",tPay],["Other Expenses",tExp]].map(([l,v])=>
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}>
            <span style={{color:C.muted}}>{l}</span><span style={{fontWeight:600}}>{GHC(v)}</span>
          </div>)}
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0 0",fontSize:14,fontWeight:700}}>
          <span>Total Out</span><span style={{color:C.danger}}>{GHC(out)}</span>
        </div>
      </Card>
    </div>
    <Card><ST title="Recent Issues"/>
      <table style={{fontSize:13}}><thead><tr>{["Date","Car","Driver","Type","Status"].map(h=><th key={h} style={{padding:"8px 12px",background:"#f4f6f9",color:C.muted,fontWeight:600,textAlign:"left",borderBottom:`1px solid ${C.border}`}}>{h}</th>)}</tr></thead>
      <tbody>{logs.slice(0,4).map((l,i)=><tr key={i} style={{borderBottom:`1px solid ${C.border}`}}><td style={{padding:"9px 12px"}}>{l.date}</td><td style={{padding:"9px 12px"}}>{l.carID}</td><td style={{padding:"9px 12px"}}>{l.driver}</td><td style={{padding:"9px 12px"}}>{l.type}</td><td style={{padding:"9px 12px"}}><SBadge s={l.status}/></td></tr>)}</tbody></table>
    </Card>
  </div>;
}

// ─── FINANCIAL CHART ──────────────────────────────────────────────────────
function FinancialChart({sales,expenses,oil,salaries,parts,payments}){
  const barRef=useRef(null),pieRef=useRef(null),lineRef=useRef(null);
  const charts=useRef({});
  const allWeeks=[...new Set([...sales,...oil,...salaries,...parts,...payments,...expenses].map(x=>x.week))].slice(0,5).reverse();
  const wd=allWeeks.map(wk=>({
    week:wk,
    revenue:sales.filter(s=>s.week===wk).reduce((a,b)=>a+b.revenue,0),
    oil:oil.filter(o=>o.week===wk).reduce((a,b)=>a+b.total,0),
    salaries:salaries.filter(s=>s.week===wk).reduce((a,b)=>a+b.total,0),
    parts:parts.filter(p=>p.week===wk).reduce((a,b)=>a+b.total,0),
    expenses:expenses.filter(e=>e.week===wk).reduce((a,b)=>a+b.amount,0),
    payments:payments.filter(p=>p.week===wk).reduce((a,b)=>a+b.amount,0),
  }));
  const wl=allWeeks.map(w=>w.replace(/\(.*\)/,"").trim());
  useEffect(()=>{
    Object.values(charts.current).forEach(c=>c?.destroy());

// ─── GENERIC CRUD HELPERS ─────────────────────────────────────────────────
const save_ = (key,val) => save(key,val);

function useListCRUD(key,initial){
  const [list,setList]=useState(initial);
  const update=useCallback(next=>{setList(next);save_(key,next);},[key]);
  const add=item=>{const next=[...list,{...item,id:uid()}];update(next);};
  const edit=(id,item)=>{const next=list.map(x=>x.id===id?{...item,id}:x);update(next);};
  const del=id=>{const next=list.filter(x=>x.id!==id);update(next);};
  return{list,add,edit,del,setList:update};
}

        <div><span style={{color:C.muted}}>Driver: </span><strong>{detail.driver||"N/A"}</strong></div>
        <div><span style={{color:C.muted}}>Status: </span><SBadge s={detail.status}/></div>
      </div>
      <div style={{fontSize:13,background:"#fff",padding:"10px 14px",borderRadius:8,border:`1px solid ${C.border}`}}>{detail.desc}</div>
    </Card>}
    <div style={{display:"flex",flexDirection:"column",gap:12}}>
      {logs.map(l=>{
        const [sc,sbg]=sevColor[l.severity]||[C.muted,"#f0f2f5"];
        return <Card key={l.id} style={{display:"flex",justifyContent:"space-between",alignItems:"flex-start",gap:16}}>
          <div style={{flex:1}}>
            <div style={{display:"flex",gap:8,alignItems:"center",marginBottom:6,flexWrap:"wrap"}}>
              <span style={{fontWeight:700,color:C.primary,fontSize:14}}>{l.type}</span>
              <Badge label={l.severity} color={sc} bg={sbg} border={sc+"66"}/>
              <SBadge s={l.status}/>
              <span style={{fontSize:12,color:C.muted}}>• {l.date}</span>
            </div>
            <div style={{fontSize:13,color:C.muted,marginBottom:4}}><strong style={{color:C.text}}>{l.carID}</strong> — {l.driver||"N/A"}</div>
            <div style={{fontSize:13,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",maxWidth:460}}>{l.desc}</div>
          </div>
          <div style={{display:"flex",gap:6,flexShrink:0}}>
            <Btn small variant="outline" onClick={()=>setDetail(detail?.id===l.id?null:l)}>View</Btn>
            <Btn small variant="outline" onClick={()=>openEdit(l)}>✏️</Btn>
            <Btn small variant="ghost" danger onClick={()=>setConfirm(l.id)}>🗑️</Btn>
          </div>
        </Card>;
      })}
    </div>
    {modal&&<Modal title={modal.mode==="add"?"Report New Issue":"Edit Issue"} onClose={()=>setModal(null)}>
      <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:12}}>
        <Inp label="Date" value={d.date} onChange={fld("date")} type="date" required/>
        <Inp label="Car ID" value={d.carID} onChange={fld("carID")} options={carIDs}/>
        <Inp label="Driver" value={d.driver} onChange={fld("driver")}/>
        <Inp label="Type" value={d.type} onChange={fld("type")} options={["Accident","Insurance Claim","Breakdown","Traffic Offence","Vehicle Theft","Other"]}/>
        <Inp label="Severity" value={d.severity} onChange={fld("severity")} options={["Low","Moderate","High"]}/>
        <Inp label="Status" value={d.status} onChange={fld("status")} options={["Open","In Review","Resolved"]}/>
      </div>
      <div style={{marginBottom:16}}>
        <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Description <span style={{color:C.danger}}>*</span></label>
        <textarea value={d.desc} onChange={e=>fld("desc")(e.target.value)} rows={3} style={{display:"block",width:"100%",marginTop:4,padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,resize:"vertical",boxSizing:"border-box"}}/>
      </div>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={()=>setModal(null)}>Cancel</Btn>
        <Btn variant="accent" onClick={save}>Save</Btn>
      </div>
    </Modal>}
    {confirm&&<Modal title="Delete Issue?" onClose={()=>setConfirm(null)}>
      <p style={{fontSize:13,color:C.muted,marginBottom:20}}>Delete this incident report permanently?</p>
      <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
        <Btn variant="ghost" onClick={()=>setConfirm(null)}>Cancel</Btn>
        <Btn variant="primary" danger onClick={()=>del(confirm)}>Delete</Btn>
      </div>
    </Modal>}
  </div>;
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────
function App(){
  const [settings,setSettings]=useState(()=>({...DEFAULT_SETTINGS,...(LS.get("settings")||{})}));
  const [authed,setAuthed]=useState(()=>LS.get("auth")===true);
  const [page,setPage]=useState("dashboard");
  const [sideOpen,setSideOpen]=useState(true);
  const [cars,setCars]=useState(()=>load("cars"));
  const [sales,setSales]=useState(()=>load("sales"));
  const [expenses,setExpenses]=useState(()=>load("expenses"));
  const [payments,setPayments]=useState(()=>load("payments"));
  const [oil,setOil]=useState(()=>load("oil"));
  const [salaries,setSalaries]=useState(()=>load("salaries"));
  const [parts,setParts]=useState(()=>load("parts"));
  const [insurance,setInsurance]=useState(()=>load("insurance"));
  const [logs,setLogs]=useState(()=>load("logs"));
  const [installPrompt,setInstallPrompt]=useState(null);
  const [installDismissed,setInstallDismissed]=useState(false);

  useEffect(()=>{
    const handler=e=>{e.preventDefault();setInstallPrompt(e);};
    window.addEventListener('beforeinstallprompt',handler);
    return()=>window.removeEventListener('beforeinstallprompt',handler);
  },[]);

  const installApp=()=>{
    if(!installPrompt)return;
    installPrompt.prompt();
    installPrompt.userChoice.then(()=>{setInstallPrompt(null);});
  };

  const saveSettings=newS=>{
    const credChanged=newS.adminUsername!==settings.adminUsername||newS.adminPassword!==settings.adminPassword;
    setSettings(newS);
    LS.set("settings",newS);
    if(credChanged){
      // Log out so they re-authenticate with new credentials
      LS.set("auth",false);
      setAuthed(false);
      alert("Login credentials updated. Please sign in with your new username and password.");
    }
  };

  const login=()=>{LS.set("auth",true);setAuthed(true);};
  const logout=()=>{LS.set("auth",false);setAuthed(false);};

  // Use settings-driven credentials for login check
  if(!authed) return <LoginPage onLogin={login} settings={settings}/>;

  const carIDs=cars.map(c=>c.id);
  const S=settings; // shorthand

  const nav=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {id:"finance",icon:"📈",label:"Financial Charts"},
    {id:"cars",icon:"🚐",label:"Fleet & Drivers"},
    {id:"sales",icon:"💰",label:"Weekly Sales"},
    {id:"payments",icon:"👥",label:"Payments to Others"},
    {id:"expenses",icon:"📋",label:"Other Expenses"},
    {id:"oil",icon:"🛢️",label:"Oil Records"},
    {id:"salaries",icon:"👷",label:"Driver Salaries"},
    {id:"parts",icon:"🔧",label:"Car Parts"},
    {id:"insurance",icon:"🛡️",label:"Insurance"},
    {id:"log",icon:"📝",label:"Issue Log"},
    {id:"settings",icon:"⚙️",label:"Settings"},
  ];

  const pages={
    dashboard:<Dashboard cars={cars} sales={sales} expenses={expenses} oil={oil} salaries={salaries} parts={parts} logs={logs} payments={payments}/>,
    finance:<FinancialChart sales={sales} expenses={expenses} oil={oil} salaries={salaries} parts={parts} payments={payments}/>,
    cars:<CarsPage cars={cars} setCars={setCars}/>,
    sales:<SalesPage sales={sales} setSales={setSales} carIDs={carIDs}/>,
    payments:<PaymentsPage payments={payments} setPayments={setPayments}/>,
    expenses:<ExpensesPage expenses={expenses} setExpenses={setExpenses}/>,
    oil:<OilPage oil={oil} setOil={setOil}/>,
    salaries:<SalariesPage salaries={salaries} setSalaries={setSalaries}/>,
    parts:<PartsPage parts={parts} setParts={setParts} carIDs={carIDs}/>,
    insurance:<InsurancePage insurance={insurance} setInsurance={setInsurance} cars={cars}/>,
    log:<LogPage logs={logs} setLogs={setLogs} carIDs={carIDs}/>,
    settings:<SettingsPage settings={settings} onSave={saveSettings}/>,
  };

  const logoBox=<div style={{width:38,height:38,borderRadius:9,background:S.accentColor,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
    {S.logoImage
      ?<img src={S.logoImage} alt="logo" style={{width:"100%",height:"100%",objectFit:"cover"}}/>
      :<span style={{fontWeight:800,fontSize:13,color:"#fff",letterSpacing:0.5}}>{S.logoText||S.companyName.slice(0,3).toUpperCase()}</span>}
  </div>;

  return <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",background:S.appBgImage?`url(${S.appBgImage}) center/cover fixed`:C.bg,minHeight:"100vh",display:"flex",flexDirection:"column"}}>
    {/* Header */}
    <div style={{background:S.primaryColor,color:"#fff",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,boxShadow:"0 2px 8px rgba(0,0,0,0.2)",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>setSideOpen(o=>!o)} style={{background:"none",border:"none",color:"#fff",fontSize:20,cursor:"pointer",padding:4,lineHeight:1}}>☰</button>
        {logoBox}
        <div>
          <div style={{fontWeight:700,fontSize:16}}>{S.companyName}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.6)"}}>{S.tagline}</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.65)",textAlign:"right"}}>
          {S.address&&<div>📍 {S.address}</div>}
          {S.phone&&<div>📞 {S.phone}</div>}
          {S.email&&<div>✉️ {S.email}</div>}
        </div>
        <button onClick={logout} style={{background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.25)",color:"#fff",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>🔒 Logout</button>
      </div>
    </div>

    {/* PWA Install Banner */}
    {installPrompt&&!installDismissed&&<div style={{background:"#1a4a2c",color:"#fff",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:13,gap:12}}>
      <span>📲 <strong>Install {S.companyName}</strong> — Add to your desktop for offline access, no internet needed.</span>
      <div style={{display:"flex",gap:8,flexShrink:0}}>
        <button onClick={installApp} style={{background:S.accentColor,color:"#fff",border:"none",borderRadius:6,padding:"5px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>Install App</button>
        <button onClick={()=>setInstallDismissed(true)} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,cursor:"pointer"}}>✕</button>
      </div>
    </div>}

    <div style={{display:"flex",flex:1,overflow:"hidden",height:`calc(100vh - ${60+(installPrompt&&!installDismissed?44:0)}px)`}}>
      {/* Sidebar */}
      {sideOpen&&<div style={{width:205,background:"#fff",borderRight:`1px solid ${C.border}`,padding:"12px 0",display:"flex",flexDirection:"column",gap:1,flexShrink:0,overflowY:"auto"}}>
        {nav.map(i=><button key={i.id} onClick={()=>setPage(i.id)} style={{
          display:"flex",alignItems:"center",gap:9,padding:"9px 18px",
          background:page===i.id?"#eef2f8":"transparent",border:"none",cursor:"pointer",
          textAlign:"left",color:page===i.id?S.primaryColor:C.text,
          fontWeight:page===i.id?600:400,fontSize:13,
          borderLeft:page===i.id?`3px solid ${S.primaryColor}`:"3px solid transparent",
          marginTop:i.id==="settings"?8:0}}>
          <span style={{fontSize:15}}>{i.icon}</span>{i.label}
        </button>)}
        <div style={{borderTop:`1px solid ${C.border}`,margin:"8px 0 0",padding:"10px 18px 0"}}>
          <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:4}}>SIGNED IN AS</div>
          <div style={{fontSize:12,color:C.text,fontWeight:600}}>👤 {S.adminUsername}</div>
        </div>
      </div>}
      {/* Main content */}
      <div style={{flex:1,overflowY:"auto"}}>{pages[page]}</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
// Register Service Worker for offline PWA support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('/byt-transport/sw.js')
      .then(reg => console.log('BYT Transport SW registered:', reg.scope))
      .catch(err => console.log('SW registration failed:', err));
  });
}
</script>
</body>
</html>
