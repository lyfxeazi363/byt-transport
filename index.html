const init=k=>loadData(k)??SEED[k];
const uid=()=>Date.now()+Math.random();
const GHC=n=>`GH₵ ${Number(n).toLocaleString("en-GH",{minimumFractionDigits:2})}`;
const getInsStatus=exp=>{if(!exp)return"Unknown";const d=Math.ceil((new Date(exp)-new Date())/(864e5));return d<0?"Expired":d<=30?"Expiring Soon":"Active";};

/* ── SHARED UI ───────────────────────────────────────── */
const SM={Active:[C.success,C.sBg,"#aedcc2"],Maintenance:[C.accent,C.wBg,C.wBd],Paid:[C.success,C.sBg,"#aedcc2"],Pending:[C.wTx,C.wBg,C.wBd],Open:[C.danger,C.dBg,"#f5b0b0"],"In Review":[C.info,C.iBg,"#a5c2f2"],Resolved:[C.success,C.sBg,"#aedcc2"],Expired:[C.danger,C.dBg,"#f5b0b0"],"Expiring Soon":[C.wTx,C.wBg,C.wBd],Unknown:[C.muted,"#f0f2f5","#c8cdd4"]};

function Bdg({label,color,bg,border}){
  return <span style={{fontSize:11,fontWeight:600,padding:"2px 10px",borderRadius:20,background:bg,color,border:`1px solid ${border}`,whiteSpace:"nowrap"}}>{label}</span>;
}
function SBdg({s}){const[c,bg,b]=SM[s]||SM.Unknown;return <Bdg label={s} color={c} bg={bg} border={b}/>;}
function Card({children,style}){return <div style={{background:"#fff",borderRadius:10,border:`1px solid ${C.border}`,padding:"20px 22px",...style}}>{children}</div>;}
function Row({title,action}){return <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",marginBottom:18}}><h2 style={{fontSize:17,fontWeight:700,color:C.primary,margin:0}}>{title}</h2>{action}</div>;}
function Metric({label,value,sub,color}){return <div style={{background:color||"#f4f6f9",borderRadius:10,padding:"16px 20px",border:`1px solid ${C.border}`}}><div style={{fontSize:12,color:C.muted,fontWeight:600,marginBottom:6}}>{label}</div><div style={{fontSize:22,fontWeight:700,color:C.primary}}>{value}</div>{sub&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>{sub}</div>}</div>;}
function Btn({children,onClick,v="primary",sm,danger}){
  const base={primary:{background:C.primary,color:"#fff",border:"none"},accent:{background:C.accent,color:"#fff",border:"none"},outline:{background:"#fff",color:C.primary,border:`1px solid ${C.primary}`},ghost:{background:"transparent",color:C.muted,border:`1px solid ${C.border}`}};
  const s=base[v]||base.primary;
  return <button onClick={onClick} style={{...s,...(danger?{background:"#fff",color:C.danger,border:`1px solid ${C.danger}`}:{}),cursor:"pointer",borderRadius:7,padding:sm?"4px 10px":"8px 16px",fontSize:sm?11:13,fontWeight:600,whiteSpace:"nowrap"}}>{children}</button>;
}
function Inp({label,value,onChange,type="text",opts,req,ph}){
  return <div style={{display:"flex",flexDirection:"column",gap:4}}>
    <label style={{fontSize:12,fontWeight:600,color:C.muted}}>{label}{req&&<span style={{color:C.danger}}> *</span>}</label>
    {opts
      ?<select value={value} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text,background:"#fff"}}>
        <option value="">Select…</option>
        {opts.map(o=><option key={o} value={o}>{o}</option>)}
      </select>
      :<input type={type} value={value} placeholder={ph||""} onChange={e=>onChange(e.target.value)} style={{padding:"7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13,color:C.text}}/>}
  </div>;
}
function THead({cols}){return <thead><tr>{cols.map((h,i)=><th key={i} style={{padding:"8px 12px",background:"#f4f6f9",color:C.muted,fontWeight:600,textAlign:"left",borderBottom:`1px solid ${C.border}`,whiteSpace:"nowrap"}}>{h}</th>)}</tr></thead>;}
function TRow({cells}){return <tr style={{borderBottom:`1px solid ${C.border}`}}>{cells.map((c,i)=><td key={i} style={{padding:"9px 12px",verticalAlign:"middle"}}>{c}</td>)}</tr>;}
function Modal({title,onClose,children}){
  return <div className="overlay" onClick={e=>{if(e.target===e.currentTarget)onClose();}}>
    <div className="modal">
      <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
        <h3 style={{fontSize:16,fontWeight:700,color:C.primary}}>{title}</h3>
        <button onClick={onClose} style={{background:"none",border:"none",fontSize:22,color:C.muted,lineHeight:1,cursor:"pointer"}}>×</button>
      </div>
      {children}
    </div>
  </div>;
}
function ConfirmModal({msg,onConfirm,onClose}){
  return <Modal title="Confirm Delete" onClose={onClose}>
    <p style={{fontSize:13,color:C.muted,marginBottom:20}}>{msg}</p>
    <div style={{display:"flex",gap:10,justifyContent:"flex-end"}}>
      <Btn v="ghost" onClick={onClose}>Cancel</Btn>
      <Btn v="primary" danger onClick={onConfirm}>Delete</Btn>
    </div>
  </Modal>;
}
function ActBtns({onEdit,onDel}){
  return <div style={{display:"flex",gap:6}}>
    <Btn sm v="outline" onClick={onEdit}>✏️ Edit</Btn>
    <Btn sm v="ghost" danger onClick={onDel}>🗑️</Btn>
  </div>;
}
function FormFooter({onCancel,onSave}){
  return <div style={{display:"flex",gap:10,justifyContent:"flex-end",marginTop:4}}>
    <Btn v="ghost" onClick={onCancel}>Cancel</Btn>
    <Btn v="accent" onClick={onSave}>Save</Btn>
  </div>;
}
function Grid({children}){return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:16}}>{children}</div>;}
function Full({children}){return <div style={{gridColumn:"1/-1"}}>{children}</div>;}

/* ── LOGIN ───────────────────────────────────────────── */
function Login({onLogin,S}){
  const [u,setU]=useState(""),[p,setP]=useState(""),[err,setErr]=useState(""),[show,setShow]=useState(false);
  const go=()=>{if(u===S.username&&p===S.password)onLogin();else{setErr("Invalid username or password.");setP("");}};
  const bgStyle=S.loginBg?{backgroundImage:`url(${S.loginBg})`,backgroundSize:"cover",backgroundPosition:"center"}:{background:`linear-gradient(135deg,${S.primaryColor} 0%,#2a5a8c 100%)`};
  return <div style={{minHeight:"100vh",...bgStyle,display:"flex",alignItems:"center",justifyContent:"center"}}>
    <div style={{background:"#fff",borderRadius:16,padding:"40px 36px",width:360,boxShadow:"0 20px 60px rgba(0,0,0,0.3)"}}>
      <div style={{textAlign:"center",marginBottom:28}}>
        <div style={{width:60,height:60,borderRadius:14,background:S.accentColor,display:"inline-flex",alignItems:"center",justifyContent:"center",fontWeight:800,fontSize:20,color:"#fff",marginBottom:14,overflow:"hidden"}}>
          {S.logoImage?<img src={S.logoImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span>{S.logoText||S.companyName.slice(0,3).toUpperCase()}</span>}
        </div>
        <div style={{fontSize:22,fontWeight:700,color:S.primaryColor}}>{S.companyName}</div>
        <div style={{fontSize:13,color:C.muted,marginTop:4}}>{S.tagline}</div>
        {(S.address||S.phone)&&<div style={{fontSize:11,color:C.muted,marginTop:3}}>{S.address&&`📍 ${S.address}`}{S.address&&S.phone&&" • "}{S.phone&&`📞 ${S.phone}`}</div>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:14}}>
        <Inp label="Username" value={u} onChange={setU} ph="Enter username" req/>
        <div style={{display:"flex",flexDirection:"column",gap:4}}>
          <label style={{fontSize:12,fontWeight:600,color:C.muted}}>Password <span style={{color:C.danger}}>*</span></label>
          <div style={{position:"relative"}}>
            <input type={show?"text":"password"} value={p} onChange={e=>setP(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} placeholder="••••••••" style={{width:"100%",padding:"7px 36px 7px 10px",borderRadius:6,border:`1px solid ${C.border}`,fontSize:13}}/>
            <button onClick={()=>setShow(s=>!s)} style={{position:"absolute",right:8,top:"50%",transform:"translateY(-50%)",background:"none",border:"none",color:C.muted,fontSize:14,cursor:"pointer"}}>{show?"🙈":"👁"}</button>
          </div>
        </div>
        {err&&<div style={{fontSize:12,color:C.danger,background:C.dBg,padding:"8px 12px",borderRadius:6}}>{err}</div>}
        <button onClick={go} style={{background:S.primaryColor,color:"#fff",border:"none",borderRadius:8,padding:11,fontSize:14,fontWeight:700,cursor:"pointer",marginTop:4}}>Sign In</button>
      </div>
      <div style={{marginTop:16,textAlign:"center",fontSize:11,color:C.muted}}>🔒 Authorised administrators only</div>
    </div>
  </div>;
}

/* ── SETTINGS ────────────────────────────────────────── */
function Settings({S,onSave}){
  const [f,setF]=useState({...S});
  const [tab,setTab]=useState("branding");
  const [ok,setOk]=useState(false);
  const set=k=>v=>setF(p=>({...p,[k]:v}));

  const upload=(key,maxKB)=>e=>{
    const file=e.target.files[0];if(!file)return;
    if(file.size>maxKB*1024){alert(`Please use an image under ${maxKB}KB.`);return;}
    const r=new FileReader();r.onload=ev=>setF(p=>({...p,[key]:ev.target.result}));r.readAsDataURL(file);
    e.target.value="";
  };

  const save=()=>{
    if(!f.companyName||!f.username||!f.password){alert("Company name, username and password are required.");return;}
    const credChanged=f.username!==S.username||f.password!==S.password;
    onSave(f,credChanged);
    setOk(true);setTimeout(()=>setOk(false),3000);
  };

  const TABS=[{id:"branding",label:"🎨 Branding"},{id:"backgrounds",label:"🖼️ Backgrounds"},{id:"contact",label:"📍 Contact"},{id:"security",label:"🔐 Security"}];

  const UploadBox=({field,label,maxKB,hint,previewStyle})=>(
    <div style={{border:`2px dashed ${C.border}`,borderRadius:10,padding:16,display:"flex",gap:16,alignItems:"flex-start",flexWrap:"wrap"}}>
      <div style={{width:160,height:100,borderRadius:8,overflow:"hidden",flexShrink:0,border:`1px solid ${C.border}`,...previewStyle}}>
        {f[field]&&<img src={f[field]} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>}
      </div>
      <div style={{display:"flex",flexDirection:"column",gap:8,flex:1}}>
        <label style={{background:S.primaryColor,color:"#fff",borderRadius:7,padding:"7px 14px",fontSize:12,fontWeight:600,cursor:"pointer",display:"inline-block",width:"fit-content"}}>
          📁 {label}
          <input type="file" accept="image/*" onChange={upload(field,maxKB)} style={{display:"none"}}/>
        </label>
        {f[field]
          ?<><div style={{fontSize:12,color:C.success,fontWeight:600}}>✓ Image loaded</div>
            <button onClick={()=>setF(p=>({...p,[field]:""}))} style={{background:"none",border:`1px solid ${C.danger}`,color:C.danger,borderRadius:6,padding:"4px 10px",fontSize:11,cursor:"pointer",fontWeight:600,width:"fit-content"}}>✕ Remove</button></>
          :<div style={{fontSize:12,color:C.muted}}>No image set</div>}
        <div style={{fontSize:11,color:C.muted}}>{hint}</div>
      </div>
    </div>
  );

  return <div style={{padding:24,maxWidth:680}}>
    <div style={{marginBottom:20}}>
      <h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>⚙️ Settings</h1>
      <p style={{margin:"6px 0 0",fontSize:13,color:C.muted}}>Customise branding, backgrounds, contact details and login credentials. All changes save to this device.</p>
    </div>

    {/* Tabs */}
    <div style={{display:"flex",gap:2,marginBottom:20,borderBottom:`2px solid ${C.border}`}}>
      {TABS.map(t=><button key={t.id} onClick={()=>setTab(t.id)} style={{padding:"9px 16px",fontSize:13,fontWeight:tab===t.id?700:400,background:"none",border:"none",cursor:"pointer",color:tab===t.id?C.primary:C.muted,borderBottom:tab===t.id?`2px solid ${C.primary}`:"2px solid transparent",marginBottom:-2}}>{t.label}</button>)}
    </div>

    {/* BRANDING */}
    {tab==="branding"&&<Card>
      <h3 style={{fontSize:14,fontWeight:700,color:C.primary,marginBottom:16}}>Company Branding</h3>
      {/* Live preview */}
      <div style={{marginBottom:20,padding:14,background:"#f4f6f9",borderRadius:10,display:"flex",alignItems:"center",gap:14}}>
        <div style={{width:48,height:48,borderRadius:10,background:f.accentColor,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
          {f.logoImage?<img src={f.logoImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontWeight:800,fontSize:13,color:"#fff"}}>{f.logoText||f.companyName.slice(0,3).toUpperCase()}</span>}
        </div>
        <div>
          <div style={{fontWeight:700,fontSize:16,color:f.primaryColor}}>{f.companyName||"Company Name"}</div>
          <div style={{fontSize:11,color:C.muted}}>{f.tagline||"Tagline"}</div>
          <div style={{fontSize:11,color:C.muted,marginTop:1}}>{f.address&&`📍 ${f.address}`}{f.address&&f.phone&&" • "}{f.phone&&`📞 ${f.phone}`}</div>
        </div>
      </div>
      <Grid>
        <Inp label="Company Name" value={f.companyName} onChange={set("companyName")} req/>
        <Inp label="Logo Letters (if no image)" value={f.logoText} onChange={set("logoText")}/>

/* ── DASHBOARD ───────────────────────────────────────── */
function Dashboard({cars,sales,expenses,oil,salaries,parts,logs,payments}){
  const wk=WEEKS[0];
  const rev=sales.filter(s=>s.week===wk).reduce((a,b)=>a+b.revenue,0);
  const tO=oil.filter(o=>o.week===wk).reduce((a,b)=>a+b.total,0);
  const tE=expenses.filter(e=>e.week===wk).reduce((a,b)=>a+b.amount,0);
  const tS=salaries.filter(s=>s.week===wk).reduce((a,b)=>a+b.total,0);
  const tP=parts.filter(p=>p.week===wk).reduce((a,b)=>a+b.total,0);
  const tPy=payments.filter(p=>p.week===wk).reduce((a,b)=>a+b.amount,0);
  const out=tO+tE+tS+tP+tPy;const net=rev-out;
  const ws=sales.filter(s=>s.week===wk);
  const open=logs.filter(l=>l.status!=="Resolved").length;
  return <div style={{padding:24,display:"flex",flexDirection:"column",gap:20}}>
    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <div><h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>Dashboard</h1><p style={{margin:"4px 0 0",fontSize:13,color:C.muted}}>Current: {wk}</p></div>
      <div style={{fontSize:12,color:C.muted}}>{new Date().toDateString()}</div>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(145px,1fr))",gap:14}}>
      <Metric label="Weekly Revenue" value={GHC(rev)} sub={`${ws.length} drivers`}/>
      <Metric label="Net Profit" value={GHC(net)} sub="After all expenses" color={net>=0?"#e9f5ee":"#fceaea"}/>
      <Metric label="Fleet Size" value={cars.length} sub={`${cars.filter(c=>c.status==="Active").length} active`}/>
      <Metric label="Open Issues" value={open} sub="Accidents & claims" color={open>0?C.wBg:"#f4f6f9"}/>
      <Metric label="Payroll Paid" value={GHC(salaries.filter(s=>s.week===wk&&s.status==="Paid").reduce((a,b)=>a+b.total,0))} sub="This week"/>
    </div>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card>
        <Row title="Top Earners — This Week"/>
        <table><THead cols={["Driver","Trips","Revenue"]}/>
        <tbody>{[...ws].sort((a,b)=>b.revenue-a.revenue).map((s,i)=><TRow key={i} cells={[s.driver,s.trips,<span style={{color:C.success,fontWeight:600}}>{GHC(s.revenue)}</span>]}/>)}</tbody></table>
      </Card>
      <Card>
        <Row title="Expense Breakdown"/>
        {[["Oil",tO],["Salaries",tS],["Parts",tP],["Payments to Others",tPy],["Other Expenses",tE]].map(([l,v])=>
          <div key={l} style={{display:"flex",justifyContent:"space-between",padding:"7px 0",borderBottom:`1px solid ${C.border}`,fontSize:13}}><span style={{color:C.muted}}>{l}</span><span style={{fontWeight:600}}>{GHC(v)}</span></div>)}
        <div style={{display:"flex",justifyContent:"space-between",padding:"10px 0 0",fontSize:14,fontWeight:700}}><span>Total Out</span><span style={{color:C.danger}}>{GHC(out)}</span></div>
      </Card>
    </div>
    <Card>
      <Row title="Recent Issues"/>
      <table><THead cols={["Date","Car","Driver","Type","Status"]}/>
      <tbody>{logs.slice(0,4).map((l,i)=><TRow key={i} cells={[l.date,l.carID,l.driver,l.type,<SBdg s={l.status}/>]}/>)}</tbody></table>
    </Card>
  </div>;
}

/* ── FINANCIAL CHART ─────────────────────────────────── */
function Finance({sales,expenses,oil,salaries,parts,payments}){
  const bRef=useRef(),pRef=useRef(),lRef=useRef(),charts=useRef({});
  const allW=[...new Set([...sales,...oil,...salaries,...parts,...payments,...expenses].map(x=>x.week))].slice(0,5).reverse();
  const wd=allW.map(wk=>({wk,rev:sales.filter(s=>s.week===wk).reduce((a,b)=>a+b.revenue,0),oil:oil.filter(o=>o.week===wk).reduce((a,b)=>a+b.total,0),sal:salaries.filter(s=>s.week===wk).reduce((a,b)=>a+b.total,0),pts:parts.filter(p=>p.week===wk).reduce((a,b)=>a+b.total,0),exp:expenses.filter(e=>e.week===wk).reduce((a,b)=>a+b.amount,0),pay:payments.filter(p=>p.week===wk).reduce((a,b)=>a+b.amount,0)}));
  const labs=allW.map(w=>w.replace(/\(.*\)/,"").trim());
  useEffect(()=>{
    Object.values(charts.current).forEach(c=>c?.destroy());
    charts.current.bar=new Chart(bRef.current,{type:"bar",data:{labels:labs,datasets:[{label:"Revenue",data:wd.map(d=>d.rev),backgroundColor:"rgba(26,122,74,0.8)",borderRadius:4},{label:"Total Out",data:wd.map(d=>d.oil+d.sal+d.pts+d.exp+d.pay),backgroundColor:"rgba(185,48,48,0.75)",borderRadius:4}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},scales:{y:{beginAtZero:true,ticks:{callback:v=>"GH₵"+v.toLocaleString()}},x:{grid:{display:false}}}}});
    const lat=wd[wd.length-1]||{};
    charts.current.pie=new Chart(pRef.current,{type:"doughnut",data:{labels:["Oil","Salaries","Parts","Other Exp","Payments"],datasets:[{data:[lat.oil||0,lat.sal||0,lat.pts||0,lat.exp||0,lat.pay||0],backgroundColor:["#e8a020","#1a3a5c","#e05050","#1a5cbf","#1a7a4a"],borderWidth:2,borderColor:"#fff"}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"right",labels:{font:{size:11},padding:10}},tooltip:{callbacks:{label:ctx=>`${ctx.label}: GH₵${ctx.parsed.toLocaleString()}`}}}}});
    charts.current.line=new Chart(lRef.current,{type:"line",data:{labels:labs,datasets:[{label:"Net Profit",data:wd.map(d=>d.rev-(d.oil+d.sal+d.pts+d.exp+d.pay)),borderColor:"#1a3a5c",backgroundColor:"rgba(26,58,92,0.08)",fill:true,tension:0.3,pointRadius:5},{label:"Revenue",data:wd.map(d=>d.rev),borderColor:"#1a7a4a",tension:0.3,pointRadius:4,borderDash:[5,3]}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:"top"}},scales:{y:{ticks:{callback:v=>"GH₵"+v.toLocaleString()}},x:{grid:{display:false}}}}});
    return()=>Object.values(charts.current).forEach(c=>c?.destroy());
  },[JSON.stringify(wd)]);
  const lat=wd[wd.length-1]||{};const out=(lat.oil||0)+(lat.sal||0)+(lat.pts||0)+(lat.exp||0)+(lat.pay||0);const net=(lat.rev||0)-out;
  return <div style={{padding:24,display:"flex",flexDirection:"column",gap:20}}>
    <h1 style={{fontSize:20,fontWeight:700,color:C.primary,margin:0}}>Financial Charts — Money In vs Out</h1>
    <div style={{display:"grid",gridTemplateColumns:"repeat(auto-fit,minmax(140px,1fr))",gap:14}}>
      <Metric label="Latest Revenue" value={GHC(lat.rev||0)} sub="Money In" color="#e9f5ee"/>
      <Metric label="Latest Expenses" value={GHC(out)} sub="Money Out" color="#fceaea"/>
      <Metric label="Net Profit" value={GHC(net)} sub={net>=0?"Positive":"Loss"} color={net>=0?"#e9f5ee":"#fceaea"}/>
    </div>
    <Card><h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Revenue vs Total Expenses by Week</h3><div style={{height:280}}><canvas ref={bRef}/></div></Card>
    <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:18}}>
      <Card><h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Expense Breakdown — Latest Week</h3><div style={{height:240}}><canvas ref={pRef}/></div></Card>
      <Card><h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Net Profit Trend</h3><div style={{height:240}}><canvas ref={lRef}/></div></Card>
    </div>
    <Card>
      <h3 style={{fontSize:14,fontWeight:600,color:C.primary,marginBottom:14}}>Weekly Summary</h3>
      <div style={{overflowX:"auto"}}><table><THead cols={["Week","Revenue","Oil","Salaries","Parts","Expenses","Payments","Total Out","Net"]}/>
      <tbody>{wd.map((d,i)=>{const o=d.oil+d.sal+d.pts+d.exp+d.pay,n=d.rev-o;return<TRow key={i} cells={[d.wk,<span style={{color:C.success,fontWeight:600}}>{GHC(d.rev)}</span>,GHC(d.oil),GHC(d.sal),GHC(d.pts),GHC(d.exp),GHC(d.pay),<span style={{color:C.danger,fontWeight:600}}>{GHC(o)}</span>,<span style={{color:n>=0?C.success:C.danger,fontWeight:700}}>{GHC(n)}</span>]}/>;})}</tbody></table></div>
    </Card>
  </div>;
}

/* ── FLEET ───────────────────────────────────────────── */
function Fleet({cars,setCars}){

  const f=k=>v=>setM(m=>({...m,data:{...m.data,[k]:v}}));
  const save=()=>{const d=M.data;if(!d.id||!d.plate||!d.driver)return alert("Fill required fields");const next=M.mode==="add"?[...cars,d]:cars.map(c=>c.id===d.id?d:c);setCars(next);saveData("cars",next);setM(null);};
  const remove=id=>{const next=cars.filter(c=>c.id!==id);setCars(next);saveData("cars",next);setDel(null);};

    <Row title="Fleet & Driver Registry" action={<Btn onClick={()=>setM({mode:"add",data:{...blank}})}>+ Add Vehicle</Btn>}/>

}

/* ── SALES ───────────────────────────────────────────── */

  const [M,setM]=useState(null),[del,setDel]=useState(null);
  const f=k=>v=>setM(m=>({...m,data:{...m.data,[k]:v}}));
  const save=()=>{const d=M.data;if(!d.payee||!d.amount)return alert("Fill required fields");const item={...d,id:M.mode==="add"?uid():d.id,amount:Number(d.amount)};const next=M.mode==="add"?[...payments,item]:payments.map(p=>p.id===item.id?item:p);setPayments(next);saveData("payments",next);setM(null);};

      <Metric label="This Week" value={GHC(payments.filter(p=>p.week===WEEKS[0]).reduce((a,b)=>a+b.amount,0))} sub={WEEKS[0]}/>

  const [installDismissed,setInstallDismissed]=useState(false);

  useEffect(()=>{
    const h=e=>{e.preventDefault();setInstallPrompt(e);};
    window.addEventListener('beforeinstallprompt',h);
    return()=>window.removeEventListener('beforeinstallprompt',h);
  },[]);

  const login=()=>{LS.set("auth",true);setAuthed(true);};
  const logout=()=>{LS.set("auth",false);setAuthed(false);};
  const saveSettings=(newS,credChanged)=>{setS(newS);LS.set("cfg",newS);if(credChanged){LS.set("auth",false);setAuthed(false);alert("Credentials updated. Please sign in again.");};};

  if(!authed) return <Login onLogin={login} S={S}/>;

  const carIDs=cars.map(c=>c.id);
  const NAV=[
    {id:"dashboard",icon:"📊",label:"Dashboard"},
    {id:"finance",icon:"📈",label:"Financial Charts"},
    {id:"cars",icon:"🚐",label:"Fleet & Drivers"},
    {id:"sales",icon:"💰",label:"Weekly Sales"},
    {id:"payments",icon:"👥",label:"Payments to Others"},
    {id:"expenses",icon:"📋",label:"Other Expenses"},
    {id:"oil",icon:"🛢️",label:"Oil Records"},
    {id:"salaries",icon:"👷",label:"Driver Salaries"},
    {id:"parts",icon:"🔧",label:"Car Parts"},
    {id:"insurance",icon:"🛡️",label:"Insurance"},
    {id:"log",icon:"📝",label:"Issue Log"},
    {id:"settings",icon:"⚙️",label:"Settings"},
  ];
  const PAGES={
    dashboard:<Dashboard cars={cars} sales={sales} expenses={expenses} oil={oil} salaries={salaries} parts={parts} logs={logs} payments={payments}/>,
    finance:<Finance sales={sales} expenses={expenses} oil={oil} salaries={salaries} parts={parts} payments={payments}/>,
    cars:<Fleet cars={cars} setCars={setCars}/>,
    sales:<Sales sales={sales} setSales={setSales} carIDs={carIDs}/>,
    payments:<Payments payments={payments} setPayments={setPayments}/>,
    expenses:<Expenses expenses={expenses} setExpenses={setExpenses}/>,
    oil:<Oil oil={oil} setOil={setOil}/>,
    salaries:<Salaries salaries={salaries} setSalaries={setSalaries}/>,
    parts:<Parts parts={parts} setParts={setParts} carIDs={carIDs}/>,
    insurance:<Insurance insurance={insurance} setInsurance={setInsurance} cars={cars}/>,
    log:<IssueLog logs={logs} setLogs={setLogs} carIDs={carIDs}/>,
    settings:<Settings S={S} onSave={saveSettings}/>,
  };

  const appBgStyle=S.appBg?{backgroundImage:`url(${S.appBg})`,backgroundSize:"cover",backgroundPosition:"center",backgroundAttachment:"fixed"}:{background:C.bg};

  return <div style={{fontFamily:"'Segoe UI',system-ui,sans-serif",minHeight:"100vh",display:"flex",flexDirection:"column",...appBgStyle}}>
    {/* Header */}
    <div style={{background:S.primaryColor,color:"#fff",padding:"0 20px",display:"flex",alignItems:"center",justifyContent:"space-between",height:60,boxShadow:"0 2px 8px rgba(0,0,0,0.2)",position:"sticky",top:0,zIndex:100}}>
      <div style={{display:"flex",alignItems:"center",gap:12}}>
        <button onClick={()=>setSideOpen(o=>!o)} style={{background:"none",border:"none",color:"#fff",fontSize:22,cursor:"pointer",lineHeight:1,padding:4}}>☰</button>
        <div style={{width:40,height:40,borderRadius:10,background:S.accentColor,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden",flexShrink:0}}>
          {S.logoImage?<img src={S.logoImage} alt="" style={{width:"100%",height:"100%",objectFit:"cover"}}/>:<span style={{fontWeight:800,fontSize:13,color:"#fff"}}>{S.logoText||S.companyName.slice(0,3).toUpperCase()}</span>}
        </div>
        <div>
          <div style={{fontWeight:700,fontSize:16}}>{S.companyName}</div>
          <div style={{fontSize:10,color:"rgba(255,255,255,0.65)"}}>{S.tagline}</div>
        </div>
      </div>
      <div style={{display:"flex",alignItems:"center",gap:16}}>
        <div style={{fontSize:11,color:"rgba(255,255,255,0.7)",textAlign:"right"}}>
          {S.address&&<div>📍 {S.address}</div>}
          {S.phone&&<div>📞 {S.phone}</div>}
        </div>
        <button onClick={logout} style={{background:"rgba(255,255,255,0.12)",border:"1px solid rgba(255,255,255,0.25)",color:"#fff",borderRadius:7,padding:"5px 12px",fontSize:12,cursor:"pointer",fontWeight:600}}>🔒 Logout</button>
      </div>
    </div>

    {/* Install Banner */}
    {installPrompt&&!installDismissed&&<div style={{background:"#1a4a2c",color:"#fff",padding:"10px 20px",display:"flex",alignItems:"center",justifyContent:"space-between",fontSize:13,gap:12}}>
      <span>📲 <b>Install {S.companyName}</b> — Add to your desktop to use offline anywhere.</span>
      <div style={{display:"flex",gap:8,flexShrink:0}}>
        <button onClick={()=>{installPrompt.prompt();installPrompt.userChoice.then(()=>setInstallPrompt(null));}} style={{background:S.accentColor,color:"#fff",border:"none",borderRadius:6,padding:"5px 14px",fontWeight:700,fontSize:12,cursor:"pointer"}}>Install</button>
        <button onClick={()=>setInstallDismissed(true)} style={{background:"rgba(255,255,255,0.15)",color:"#fff",border:"none",borderRadius:6,padding:"5px 10px",fontSize:12,cursor:"pointer"}}>✕</button>
      </div>
    </div>}

    <div style={{display:"flex",flex:1,overflow:"hidden",height:`calc(100vh - ${installPrompt&&!installDismissed?104:60}px)`}}>
      {/* Sidebar */}
      {sideOpen&&<div style={{width:210,background:"rgba(255,255,255,0.97)",borderRight:`1px solid ${C.border}`,padding:"10px 0",display:"flex",flexDirection:"column",flexShrink:0,overflowY:"auto"}}>
        {NAV.map((n,i)=><button key={n.id} onClick={()=>setPage(n.id)} style={{
          display:"flex",alignItems:"center",gap:9,padding:"9px 18px",
          background:page===n.id?"#eef2f8":"transparent",border:"none",cursor:"pointer",
          textAlign:"left",color:page===n.id?S.primaryColor:C.text,
          fontWeight:page===n.id?700:400,fontSize:13,
          borderLeft:page===n.id?`3px solid ${S.primaryColor}`:"3px solid transparent",
          marginTop:n.id==="settings"?10:0,
          borderTop:n.id==="settings"?`1px solid ${C.border}`:"none"}}>
          <span style={{fontSize:15}}>{n.icon}</span>{n.label}
        </button>)}
        <div style={{padding:"12px 18px",marginTop:"auto",borderTop:`1px solid ${C.border}`}}>
          <div style={{fontSize:10,color:C.muted,fontWeight:600,marginBottom:4}}>SIGNED IN AS</div>
          <div style={{fontSize:12,color:C.text,fontWeight:600}}>👤 {S.username}</div>
        </div>
      </div>}
      {/* Content */}
      <div style={{flex:1,overflowY:"auto"}}>{PAGES[page]||PAGES.dashboard}</div>
    </div>
  </div>;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register('/byt-transport/sw.js')
      .then(r=>console.log('SW:',r.scope)).catch(e=>console.log('SW fail:',e));
  });
}
</script>
</body>
</html>
